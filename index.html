<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Edit</title>
    <script src="/canvas/callback-element.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --prompt-chrome-space: 8rem;
            --debug-rail-width: 22rem;
            --debug-rail-gap: 1rem;
            --debug-rail-space: calc(var(--debug-rail-width) + var(--debug-rail-gap));
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #111827;
            color: #f9fafb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .canvas-shell {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: var(--debug-rail-space);
            overflow: auto;
            padding: 2rem 2rem var(--prompt-chrome-space) 1rem;
        }

        #app {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
            width: 100%;
            min-height: calc(100vh - var(--prompt-chrome-space) - 4rem);
        }

        .item {
            position: relative;
            display: inline-block;
            width: auto;
            max-width: 100%;
            min-width: 0;
            border-radius: 10px;
            outline: 2px solid transparent;
            outline-offset: 4px;
        }

        .surface {
            display: inline-block;
            width: auto;
            max-width: 100%;
            min-width: 0;
            overflow: visible;
            vertical-align: top;
        }

        .status {
            min-height: 1.25rem;
            color: #93c5fd;
            font-size: 0.85rem;
        }

        .error {
            color: #fecaca;
        }



        .item {
            position: relative;
        }

        .component-frame {
            position: relative;
            display: inline-grid;
            width: auto;
            max-width: 100%;
            min-width: 0;
            overflow: visible;
        }

        .component-face {
            grid-area: 1 / 1;
            min-width: 0;
        }

        .component-back {
            display: grid;
            gap: 0.75rem;
            min-height: 12rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            background: rgb(31, 41, 55);
            color: rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
            display: none;
        }

        .component-back-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .component-back h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .component-back p {
            margin: 0;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.86rem;
            line-height: 1.35;
        }

        .component-back textarea {
            width: 100%;
            min-height: 10rem;
            resize: vertical;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 0.75rem;
            background: rgb(43, 52, 65);
            color: rgba(255, 255, 255, 0.92);
            font: inherit;
            line-height: 1.35;
        }

        .component-back textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.34);
            background: rgb(48, 57, 70);
        }

        .component-back-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: end;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .component-back button,
        .component-flip-button {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 0.45rem 0.75rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.88);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 650;
        }

        .component-back button:hover:not(:disabled),
        .component-flip-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        .component-back button:disabled {
            opacity: 0.48;
        }

        .component-save-button {
            background: rgba(255, 255, 255, 0.76) !important;
            color: rgba(17, 24, 39, 0.94) !important;
        }

        .component-flip-button {
            position: absolute;
            right: 0.75rem;
            top: -1.45rem;
            z-index: 40;
            opacity: 0;
            transition: opacity 120ms ease, background 120ms ease;
        }

        .component-frame:hover .component-flip-button,
        .component-flip-button:focus-visible {
            opacity: 1;
        }

        .component-front {
            pointer-events: auto;
        }

        .component-requirements-status {
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.82rem;
        }

        .component-requirements-status:empty {
            display: none;
        }

        .requirements-overlay .component-requirements-status {
            justify-self: end;
        }


        .requirements-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: rgba(3, 7, 18, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .requirements-overlay .item {
            width: min(760px, calc(100vw - 3rem));
            min-width: 0;
        }

        .requirements-overlay .component-frame {
            width: 100%;
            height: min(620px, calc(100vh - 4rem));
        }

        .requirements-overlay .component-face {
            min-height: 0;
            height: 100%;
            box-sizing: border-box;
        }

        .requirements-overlay .component-front {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .requirements-overlay .component-back {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            padding: 1.25rem;
        }

        .requirements-overlay .component-flip-button {
            display: none;
        }

        .requirements-overlay .component-back textarea {
            min-height: 0;
            height: 100%;
            resize: none;
        }

        .requirements-placeholder {
            min-height: 3rem;
            visibility: hidden;
            pointer-events: none;
        }

        .global-prompt {
            position: fixed;
            left: calc(var(--debug-rail-space) + (100vw - var(--debug-rail-space)) / 2);
            bottom: 1rem;
            z-index: 20;
            display: grid;
            grid-template-columns: max-content minmax(14rem, 1fr) max-content;
            gap: 0.45rem;
            align-items: center;
            width: min(calc(100vw - var(--debug-rail-space) - 2rem), 58rem);
            padding: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            background: rgba(34, 34, 35, 0.72);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.44),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(32px) saturate(1.35);
            -webkit-backdrop-filter: blur(32px) saturate(1.35);
            transform: translateX(-50%);
            -webkit-font-smoothing: antialiased;
        }

        .canvas-nav {
            display: flex;
            gap: 0.35rem;
            width: max-content;
            min-width: 0;
        }

        .canvas-nav select,
        .global-prompt textarea {
            min-width: 0;
            height: 2.45rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            background: rgb(43, 52, 65);
            color: rgba(255, 255, 255, 0.92);
            font: inherit;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.18);
        }

        .canvas-nav select {
            width: fit-content;
            min-width: 0;
            max-width: 12rem;
            padding: 0 0.65rem;
            field-sizing: content;
        }

        .canvas-nav .agent-select {
            max-width: 9rem;
        }

        .global-prompt textarea {
            min-height: 2.45rem;
            max-height: 8rem;
            resize: vertical;
            padding: 0.6rem 0.75rem;
            line-height: 1.2;
        }

        .canvas-nav select:focus,
        .global-prompt textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.28);
            background: rgb(48, 57, 70);
        }

        .global-prompt textarea::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .global-prompt button {
            width: max-content;
            justify-self: start;
            white-space: nowrap;
            height: 2.45rem;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 15px;
            padding: 0 0.85rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.82);
            cursor: default;
            font: inherit;
            font-weight: 650;
            letter-spacing: -0.01em;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .global-prompt button[type="submit"] {
            background: rgba(255, 255, 255, 0.70);
            color: rgba(20, 20, 21, 0.92);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .global-prompt button:hover:not(:disabled),
        .canvas-nav select:hover,
        .global-prompt textarea:hover {
            background-color: rgba(255, 255, 255, 0.14);
        }

        .global-prompt button[type="submit"]:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.78);
        }

        .global-prompt button:active:not(:disabled) {
            transform: translateY(1px);
        }

        .global-prompt button:disabled {
            cursor: default;
            opacity: 0.45;
        }


        .new-canvas-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            opacity: 1;
            transition: opacity 160ms ease;
        }

        .new-canvas-backdrop[hidden] {
            display: none;
        }

        .new-canvas-modal {
            display: grid;
            gap: 0.9rem;
            width: min(92vw, 24rem);
            padding: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            background: rgba(44, 44, 46, 0.84);
            color: rgba(255, 255, 255, 0.94);
            box-shadow:
                0 34px 90px rgba(0, 0, 0, 0.44),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(36px) saturate(1.45);
            -webkit-backdrop-filter: blur(36px) saturate(1.45);
            transform: translateY(0) scale(1);
            animation: modal-pop 180ms cubic-bezier(.2, .9, .2, 1);
        }

        @keyframes modal-pop {
            from {
                opacity: 0;
                transform: translateY(0.6rem) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .new-canvas-modal h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .new-canvas-modal p {
            margin: -0.35rem 0 0;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.88rem;
            text-align: center;
        }

        .new-canvas-modal input {
            width: 100%;
            height: 2.75rem;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 0 0.85rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.94);
            font: inherit;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.16);
        }

        .new-canvas-modal input:focus {
            outline: none;
            border-color: rgba(10, 132, 255, 0.86);
            box-shadow:
                0 0 0 4px rgba(10, 132, 255, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .new-canvas-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem;
        }

        .new-canvas-actions button {
            height: 2.65rem;
            border: 0;
            border-radius: 16px;
            padding: 0 0.8rem;
            font: inherit;
            font-weight: 680;
        }

        .new-canvas-actions button[type="button"] {
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.78);
        }

        .new-canvas-actions button[type="submit"] {
            background: rgba(10, 132, 255, 0.92);
            color: white;
        }

        .new-canvas-actions button:disabled {
            opacity: 0.42;
        }


        .global-status {
            position: fixed;
            left: calc(var(--debug-rail-space) + (100vw - var(--debug-rail-space)) / 2);
            bottom: 5.2rem;
            z-index: 21;
            width: min(calc(100vw - var(--debug-rail-space) - 2rem), 58rem);
            min-height: 1rem;
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.8rem;
            transform: translateX(-50%);
        }

        .debug-rail {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 25;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 1rem;
            width: var(--debug-rail-width);
            padding: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 15, 30, 0.84);
            color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px) saturate(1.1);
            -webkit-backdrop-filter: blur(20px) saturate(1.1);
            overflow: hidden;
        }

        .debug-resizer {
            position: fixed;
            top: 0;
            bottom: 0;
            left: calc(var(--debug-rail-width) - 0.45rem);
            z-index: 26;
            width: 0.9rem;
            cursor: col-resize;
            touch-action: none;
            background: transparent;
        }

        .debug-resizer::before {
            content: '';
            position: absolute;
            top: 1rem;
            bottom: 1rem;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(147, 197, 253, 0), rgba(147, 197, 253, 0.65), rgba(147, 197, 253, 0));
            opacity: 0.5;
        }

        .debug-resizer:hover::before,
        .debug-resizer:active::before {
            opacity: 1;
        }

        .debug-rail h2,
        .debug-rail h3,
        .debug-rail p,
        .debug-rail dl {
            margin: 0;
        }

        .debug-rail h2 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .debug-summary {
            display: grid;
            gap: 0.5rem;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
        }

        .debug-summary dl {
            display: grid;
            gap: 0.35rem;
            margin: 0;
            padding: 0;
        }

        .debug-summary div {
            display: grid;
            gap: 0.15rem;
        }

        .debug-summary dt {
            color: rgba(255, 255, 255, 0.52);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .debug-summary dd {
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.85rem;
            margin: 0;
            word-break: break-word;
        }

        .debug-output {
            margin: 0;
            min-height: 0;
            padding: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.85);
            color: rgba(226, 232, 240, 0.92);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 1100px) {
            :root {
                --debug-rail-width: 0px;
                --debug-rail-gap: 0px;
                --debug-rail-space: 0px;
            }

            .canvas-shell {
                left: 0;
                padding: 1rem 1rem var(--prompt-chrome-space);
            }

            .debug-rail {
                display: none;
            }

            .debug-resizer {
                display: none;
            }

            .global-prompt,
            .global-status {
                left: 50%;
            }
        }

    </style>
</head>
<body>
    <div class="canvas-shell" id="canvas-shell">
        <main id="app"></main>
    </div>
    <aside class="debug-rail" id="debug-rail">
        <section class="debug-summary">
            <dl>
                <div>
                    <dt>Agent</dt>
                    <dd id="debug-current-agent">Loading</dd>
                </div>
                <div>
                    <dt>Provider</dt>
                    <dd id="debug-current-backend">Loading</dd>
                </div>
                <div>
                    <dt>Canvas</dt>
                    <dd id="debug-current-canvas">Loading</dd>
                </div>
            </dl>
        </section>
        <pre class="debug-output" id="debug-output"></pre>
    </aside>
    <div class="debug-resizer" id="debug-resizer" role="separator" aria-orientation="vertical" aria-label="Resize debug panel"></div>
    <div class="global-status" id="global-status"></div>
    <div class="new-canvas-backdrop" id="new-canvas-backdrop" hidden>
        <form class="new-canvas-modal" id="new-canvas-modal" role="dialog" aria-modal="true" aria-labelledby="new-canvas-title">
            <h2 id="new-canvas-title">New Canvas</h2>
            <input id="new-canvas-name" name="name" type="text" autocomplete="off" placeholder="Name">
            <div class="new-canvas-actions">
                <button type="button" id="new-canvas-cancel">Cancel</button>
                <button type="submit" id="new-canvas-create">Create</button>
            </div>
        </form>
    </div>
    <form class="global-prompt" id="global-prompt">
        <div class="canvas-nav" aria-label="Canvas selection">
            <select id="agent-select" class="agent-select" aria-label="Agent"></select>
            <select id="canvas-select" aria-label="Canvas"></select>
            <button type="button" id="new-canvas">New</button>
        </div>
        <textarea id="global-text"></textarea>
        <button type="submit">Send</button>
    </form>

    <script>
        const app = document.getElementById('app');
        const canvasShell = document.getElementById('canvas-shell');
        const globalForm = document.getElementById('global-prompt');
        const globalText = document.getElementById('global-text');
        const globalStatus = document.getElementById('global-status');
        const agentSelect = document.getElementById('agent-select');
        const canvasSelect = document.getElementById('canvas-select');
        const newCanvas = document.getElementById('new-canvas');
        const newCanvasBackdrop = document.getElementById('new-canvas-backdrop');
        const newCanvasModal = document.getElementById('new-canvas-modal');
        const newCanvasName = document.getElementById('new-canvas-name');
        const newCanvasCancel = document.getElementById('new-canvas-cancel');
        const newCanvasCreate = document.getElementById('new-canvas-create');
        const debugCurrentAgent = document.getElementById('debug-current-agent');
        const debugCurrentBackend = document.getElementById('debug-current-backend');
        const debugCurrentCanvas = document.getElementById('debug-current-canvas');
        const debugOutput = document.getElementById('debug-output');
        const debugResizer = document.getElementById('debug-resizer');
        const instanceStyle = document.createElement('style');
        const layoutStyle = document.createElement('style');
        const transitionStyle = document.createElement('style');
        let latestComponents = [];
        let currentCanvasName = '';
        let currentCanvasPath = '';
        let statusTimer;
        let scrollSaveTimer;
        let currentLayout = null;
        let currentTransition = null;
        let debugResizePointerId = null;
        let debugResizeFrame = null;
        let debugLines = [];
        const livePromptInFlight = new Set();
        const renderedItemsByIndex = new Map();
        const componentMountsByItem = new WeakMap();
        let latestComponentByIndex = new Map();
        let lastCanvasSnapshot = '';
        const agentKindKey = 'live-edit-agent-kind';

        instanceStyle.id = 'instance-style';
        document.head.append(instanceStyle);
        layoutStyle.id = 'layout-style';
        document.head.append(layoutStyle);
        transitionStyle.id = 'transition-style';
        document.head.append(transitionStyle);
        const scrollKey = canvasName => 'live-edit-scroll:' + (canvasName || 'default');
        const debugRailWidthKey = 'live-edit-debug-rail-width';

        const clampDebugRailWidth = value => Math.max(240, Math.min(Math.round(value), Math.max(240, Math.floor(window.innerWidth * 0.55))));

        const applyDebugRailWidth = width => {
            const nextWidth = clampDebugRailWidth(width);
            document.documentElement.style.setProperty('--debug-rail-width', nextWidth + 'px');

            try {
                localStorage.setItem(debugRailWidthKey, String(nextWidth));
            } catch (error) {
                // Ignore storage failures; the resize still applies for this session.
            }
        };

        const loadDebugRailWidth = () => {
            try {
                const stored = Number.parseInt(localStorage.getItem(debugRailWidthKey) || '', 10);
                return Number.isFinite(stored) && stored > 0 ? stored : 352;
            } catch (error) {
                return 352;
            }
        };

        const currentScrollKey = () => scrollKey(canvasSelect.value);

        const setBusy = state => {
            globalForm.dataset.busy = state?.busy ? 'true' : 'false';
            globalStatus.className = state?.busy ? 'global-status busy' : 'global-status';
            globalStatus.textContent = state?.busy ? 'Working' : '';
            globalForm.querySelector('button[type="submit"]').disabled = Boolean(state?.busy);
            updatePromptChromeSpace();
        };

        const renderDebugPanel = state => {
            if (!debugCurrentAgent || !debugCurrentBackend || !debugCurrentCanvas || !debugOutput) {
                return;
            }

            const current = state && typeof state.current === 'object' ? state.current : {};
            const active = state && typeof state.active === 'object' ? state.active : {};
            debugLines = Array.isArray(state?.lines) ? state.lines.slice(-200) : [];

            const sourceLabel = current.source === 'bundled'
                ? 'Bundled agent'
                : current.source === 'global'
                    ? 'Global agent'
                    : '';
            const backendParts = [];
            const backend = active.provider || active.model ? active : current;

            if (backend.provider) {
                backendParts.push(backend.provider);
            }
            if (backend.model) {
                backendParts.push(backend.model);
            }

            debugCurrentAgent.textContent = current.status
                ? current.status.charAt(0).toUpperCase() + current.status.slice(1)
                : 'Idle';
            if (current.status === 'running' || current.status === 'waiting') {
                if (current.label) {
                    debugCurrentAgent.textContent += ' · ' + current.label;
                } else if (sourceLabel) {
                    debugCurrentAgent.textContent += ' · ' + sourceLabel;
                }
            }
            debugCurrentBackend.textContent = backendParts.length ? backendParts.join(' · ') : 'Unavailable';
            debugCurrentCanvas.textContent = state && state.canvas ? state.canvas : 'Unknown';
            renderDebugLines();
        };


        const plainDebugText = line => String(line?.text || '');

        const renderDebugLines = () => {
            if (!debugOutput) {
                return;
            }

            debugOutput.textContent = debugLines.length
                ? debugLines.map(plainDebugText).join('\n')
                : '';
            debugOutput.scrollTop = debugOutput.scrollHeight;
        };

        let debugScrollPending = false;

        const scheduleDebugScroll = () => {
            if (debugScrollPending || !debugOutput) {
                return;
            }

            debugScrollPending = true;
            requestAnimationFrame(() => {
                debugScrollPending = false;
                debugOutput.scrollTop = debugOutput.scrollHeight;
            });
        };

        const appendDebugLine = line => {

        newCanvasBackdrop.addEventListener('click', event => {
            if (event.target === newCanvasBackdrop) {
                hideNewCanvasModal();
            }
        });

        newCanvasModal.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                event.preventDefault();
                hideNewCanvasModal();
            }
        });

        newCanvasModal.addEventListener('submit', event => {
            event.preventDefault();

            if (newCanvasCreate.disabled) {
                return;
            }

            if (!newCanvasName.value.trim()) {
                newCanvasName.focus();
                return;
            }

            newCanvasCreate.disabled = true;
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Creating canvas';
            createCanvas(newCanvasName.value.trim())
                .then(() => {
                    hideNewCanvasModal();
                    globalStatus.textContent = 'Canvas created';
                })
                .catch(error => {
                    newCanvasCreate.disabled = false;
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                    newCanvasName.focus();
                });
        });

        globalForm.addEventListener('submit', event => {
            event.preventDefault();

            if (globalForm.dataset.busy === 'true') {
                return;
            }

            const prompt = globalText.value.trim();
            const button = globalForm.querySelector('button[type="submit"]');

            if (!prompt) {
                globalText.focus();
                return;
            }

            button.disabled = true;
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Sending';
            setBusy({ busy: true });

            submitCanvasPrompt(prompt)
                .then(() => {
                    globalText.value = '';
                })
                .catch(error => {
                    setBusy({ busy: false, job: null });
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                });
        });

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(saveScrollPosition, 120);
        }, { passive: true });

        window.addEventListener('resize', updatePromptChromeSpace);

        if (window.ResizeObserver) {
            const chromeResizeObserver = new ResizeObserver(updatePromptChromeSpace);

            chromeResizeObserver.observe(globalForm);
            chromeResizeObserver.observe(globalStatus);
        }

        new MutationObserver(updatePromptChromeSpace).observe(globalStatus, {
            childList: true,
            characterData: true,
            subtree: true
        });

        updatePromptChromeSpace();

        new EventSource('/events').onmessage = event => {
            let payload = null;

            try {
                payload = JSON.parse(event.data);
            } catch (error) {
                payload = null;
            }

            if (payload && payload.type === 'queue-status') {
                setBusy(payload.state || { busy: false, job: null });
                load().catch(error => {
                    app.textContent = 'Error: ' + error.message;
                });
                return;
            }

            if (payload && payload.type === 'agent-mode') {
                loadAgentChoices().catch(() => {});
                loadDebugPanel().catch(() => {});
                return;
            }

            if (payload && payload.type === 'canvases-changed') {
                loadCanvases().catch(() => {});
                return;
            }

            load().catch(error => {
                app.textContent = 'Error: ' + error.message;
            });
        };

        loadDebugPanel()
            .then(startDebugStream)
            .catch(error => {
                if (debugOutput) {
                    debugOutput.textContent = 'Error: ' + error.message;
                }
            });

        load().catch(error => {
            app.textContent = 'Error: ' + error.message;
        });
        loadAgentChoices().catch(error => {
            globalStatus.className = 'global-status error';
            globalStatus.textContent = 'Error: ' + error.message;
        });
        loadCanvases().catch(error => {
            globalStatus.className = 'global-status error';
            globalStatus.textContent = 'Error: ' + error.message;
        });

    </script>
</body>
</html>
