<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Edit</title>
    <script src="/canvas/callback-element.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --prompt-chrome-space: 8rem;
            --debug-rail-width: 22rem;
            --debug-rail-gap: 1rem;
            --debug-rail-space: calc(var(--debug-rail-width) + var(--debug-rail-gap));
        }

        body {
            display: grid;
            grid-template-columns: var(--debug-rail-width) minmax(0, 1fr);
            min-height: 100vh;
            margin: 0;
            background: #111827;
            color: #f9fafb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .canvas-shell {
            grid-column: 2;
            grid-row: 1;
            min-width: 0;
            min-height: 100vh;
            position: relative;
            overflow: auto;
        }

        #app {
            min-width: 0;
            min-height: 100vh;
            position: relative;
        }

        .canvas-repair-item {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 2rem;
        }

        .canvas-repair-item .harness-component-frame-watcher,
        .canvas-repair-item .component-front,
        .canvas-repair-item .surface {
            width: min(24rem, 100%);
        }

        .canvas-repair-item .component-flip-button {
            display: none;
        }


        .workspace-migration-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 18, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: rgba(232, 232, 234, 0.95);
        }
        /* The custom display:flex above outranks the user-agent
           [hidden]{display:none}, so without this rule the overlay would be
           visible even when toggled hidden by JS. */
        .workspace-migration-overlay[hidden] { display: none; }
        .workspace-migration-card {
            max-width: 32rem;
            padding: 1.4rem 1.6rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            background: rgba(34, 34, 35, 0.92);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
        }
        .workspace-migration-title { font-weight: 600; font-size: 1rem; margin-bottom: 0.5rem; }
        .workspace-migration-detail { font-size: 0.85rem; line-height: 1.45; color: rgba(232, 232, 234, 0.75); }
        .workspace-migration-error {
            margin-top: 0.85rem;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            background: rgba(127, 29, 29, 0.45);
            border: 1px solid rgba(252, 165, 165, 0.35);
            color: #fecaca;
            font-size: 0.78rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        .workspace-migration-actions { margin-top: 0.95rem; display: flex; justify-content: flex-end; gap: 0.6rem; }
        .workspace-migration-actions button {
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            color: #fff;
            background: rgba(59, 130, 246, 0.9);
            border: 1px solid rgba(96, 165, 250, 0.65);
            border-radius: 8px;
            padding: 0.4rem 0.9rem;
            cursor: pointer;
        }
        .workspace-migration-actions button:disabled { opacity: 0.6; cursor: progress; }
        .workspace-migration-actions button:hover:not(:disabled) { background: rgba(59, 130, 246, 1); }
        .workspace-migration-actions button.is-secondary {
            background: transparent;
            color: rgba(232, 232, 234, 0.7);
            border-color: rgba(255, 255, 255, 0.18);
        }
        .workspace-migration-actions button.is-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(232, 232, 234, 0.95);
        }

        .global-prompt {
            position: fixed;
            left: calc(var(--debug-rail-space) + (100vw - var(--debug-rail-space)) / 2);
            bottom: 1rem;
            z-index: 20;
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            gap: 1rem;
            align-items: center;
            width: min(calc(100vw - var(--debug-rail-space) - 2rem), 58rem);
            padding: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            background: rgba(34, 34, 35, 0.72);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.44),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(32px) saturate(1.35);
            -webkit-backdrop-filter: blur(32px) saturate(1.35);
            transform: translateX(-50%);
            -webkit-font-smoothing: antialiased;
        }

        .prompt-send {
            display: grid;
            grid-template-columns: max-content minmax(14rem, 1fr) max-content;
            gap: 0.45rem;
            align-items: center;
            min-width: 0;
        }

        .prompt-send > form {
            display: contents;
        }

        .canvas-nav {
            display: flex;
            gap: 0.35rem;
            width: max-content;
            min-width: 0;
        }

        .global-prompt select,
        .global-prompt textarea {
            min-width: 0;
            height: 2.45rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            background: rgb(43, 52, 65);
            color: rgba(255, 255, 255, 0.92);
            font: inherit;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.18);
        }

        .global-prompt select {
            width: fit-content;
            min-width: 0;
            max-width: 12rem;
            padding: 0 0.65rem;
            field-sizing: content;
        }

        .global-prompt .agent-select {
            max-width: 9rem;
        }

        .global-prompt textarea {
            min-height: 2.45rem;
            max-height: 8rem;
            resize: vertical;
            padding: 0.6rem 0.75rem;
            line-height: 1.2;
        }

        .global-prompt select:focus,
        .global-prompt textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.28);
            background: rgb(48, 57, 70);
        }

        .global-prompt textarea::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .global-prompt button {
            width: max-content;
            justify-self: start;
            white-space: nowrap;
            height: 2.45rem;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 15px;
            padding: 0 0.85rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.82);
            cursor: default;
            font: inherit;
            font-weight: 650;
            letter-spacing: -0.01em;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .global-prompt button[type="submit"] {
            background: rgba(255, 255, 255, 0.70);
            color: rgba(20, 20, 21, 0.92);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .global-prompt button:hover:not(:disabled),
        .global-prompt select:hover,
        .global-prompt textarea:hover {
            background-color: rgba(255, 255, 255, 0.14);
        }

        .global-prompt button[type="submit"]:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.78);
        }

        .global-prompt button:active:not(:disabled) {
            transform: translateY(1px);
        }

        .global-prompt button:disabled {
            cursor: default;
            opacity: 0.45;
        }


        .canvas-damaged-shell {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            min-width: 0;
            min-height: 0;
            padding: 2rem;
        }

        .canvas-damaged-dialog {
            display: grid;
            gap: 1rem;
            justify-items: center;
            width: min(24rem, 100%);
            min-width: 0;
            padding: 1.35rem;
            border: 1px solid rgba(248, 113, 113, 0.45);
            border-radius: 22px;
            background: rgba(31, 41, 55, 0.92);
            color: #fecaca;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
            text-align: center;
        }

        .canvas-damaged-dialog h1 {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .canvas-damaged-dialog button {
            border: 1px solid rgba(252, 165, 165, 0.35);
            border-radius: 999px;
            background: rgba(127, 29, 29, 0.55);
            color: #fecaca;
            padding: 0.65rem 1rem;
            font: inherit;
            font-weight: 700;
        }

        .canvas-damaged-dialog button:disabled {
            opacity: 0.55;
        }


        /* Harness-owned requirements editor. Not part of canvas presentation. */
        .harness-component-frame-watcher {
            position: relative;
            display: inline-grid;
            width: auto;
            max-width: 100%;
            min-width: 0;
            overflow: visible;
        }

        .component-face {
            grid-area: 1 / 1;
            min-width: 0;
        }

        .component-front {
            pointer-events: auto;
        }

        .component-back {
            display: none;
            gap: 0.75rem;
            min-height: 12rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            background: rgb(31, 41, 55);
            color: rgba(255, 255, 255, 0.92);
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
        }

        .component-back-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        .component-back h2 {
            margin: 0;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .component-back p {
            margin: 0;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.86rem;
            line-height: 1.35;
        }

        .component-back textarea {
            width: 100%;
            min-height: 10rem;
            resize: vertical;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 0.75rem;
            background: rgb(43, 52, 65);
            color: rgba(255, 255, 255, 0.92);
            font: inherit;
            line-height: 1.35;
        }

        .component-back textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.34);
            background: rgb(48, 57, 70);
        }

        .component-back-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: end;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .component-back button,
        .component-flip-button {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 0.45rem 0.75rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.88);
            font: inherit;
            font-size: 0.86rem;
            font-weight: 650;
        }

        .component-back button:hover:not(:disabled),
        .component-flip-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        .component-back button:disabled {
            opacity: 0.48;
        }

        .component-save-button {
            background: rgba(255, 255, 255, 0.76) !important;
            color: rgba(17, 24, 39, 0.94) !important;
        }

        .component-flip-button {
            position: absolute;
            right: 0.75rem;
            top: -1.1rem;
            z-index: 40;
            opacity: 0;
            transition: opacity 120ms ease, background 120ms ease;
        }

        .harness-component-frame-watcher:hover .component-flip-button,
        .component-flip-button:focus-visible {
            opacity: 1;
        }

        .component-requirements-status {
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.82rem;
        }

        .component-requirements-status:empty {
            display: none;
        }

        .requirements-overlay .component-requirements-status {
            justify-self: end;
        }

        .requirements-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 2rem;
            background: rgba(3, 7, 18, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .requirements-overlay .item {
            width: min(760px, calc(100vw - 3rem));
            min-width: 0;
        }

        .requirements-overlay .harness-component-frame-watcher {
            width: 100%;
            height: min(620px, calc(100vh - 4rem));
        }

        .requirements-overlay .component-face {
            min-height: 0;
            height: 100%;
            box-sizing: border-box;
        }

        .requirements-overlay .component-front {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .requirements-overlay .component-back {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            padding: 1.25rem;
        }

        .requirements-overlay .component-flip-button {
            display: none;
        }

        .requirements-overlay .component-back textarea {
            min-height: 0;
            height: 100%;
            resize: none;
        }

        .requirements-placeholder {
            min-height: 3rem;
            visibility: hidden;
            pointer-events: none;
        }


        .new-canvas-backdrop {
            position: fixed;
            inset: 0;
            z-index: 60;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            opacity: 1;
            transition: opacity 160ms ease;
        }

        .new-canvas-backdrop[hidden] {
            display: none;
        }

        .new-canvas-modal {
            display: grid;
            gap: 0.9rem;
            width: min(92vw, 24rem);
            padding: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            background: rgba(44, 44, 46, 0.84);
            color: rgba(255, 255, 255, 0.94);
            box-shadow:
                0 34px 90px rgba(0, 0, 0, 0.44),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(36px) saturate(1.45);
            -webkit-backdrop-filter: blur(36px) saturate(1.45);
            transform: translateY(0) scale(1);
            animation: modal-pop 180ms cubic-bezier(.2, .9, .2, 1);
        }

        @keyframes modal-pop {
            from {
                opacity: 0;
                transform: translateY(0.6rem) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .new-canvas-modal h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .new-canvas-modal p {
            margin: -0.35rem 0 0;
            color: rgba(255, 255, 255, 0.58);
            font-size: 0.88rem;
            text-align: center;
        }

        .new-canvas-modal input {
            width: 100%;
            height: 2.75rem;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 0 0.85rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.94);
            font: inherit;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.16);
        }

        .new-canvas-modal input:focus {
            outline: none;
            border-color: rgba(10, 132, 255, 0.86);
            box-shadow:
                0 0 0 4px rgba(10, 132, 255, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .new-canvas-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem;
        }

        .new-canvas-actions button {
            height: 2.65rem;
            border: 0;
            border-radius: 16px;
            padding: 0 0.8rem;
            font: inherit;
            font-weight: 680;
        }

        .new-canvas-actions button[type="button"] {
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.78);
        }

        .new-canvas-actions button[type="submit"] {
            background: rgba(10, 132, 255, 0.92);
            color: white;
        }

        .new-canvas-actions button:disabled {
            opacity: 0.42;
        }



        .debug-rail {
            position: sticky;
            top: 0;
            grid-column: 1;
            grid-row: 1;
            z-index: 25;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 1rem;
            width: auto;
            height: 100vh;
            padding: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 15, 30, 0.84);
            color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px) saturate(1.1);
            -webkit-backdrop-filter: blur(20px) saturate(1.1);
            overflow: hidden;
        }

        .debug-resizer {
            position: fixed;
            top: 0;
            bottom: 0;
            left: calc(var(--debug-rail-width) - 0.45rem);
            z-index: 26;
            width: 0.9rem;
            cursor: col-resize;
            touch-action: none;
            background: transparent;
        }

        .debug-resizer::before {
            content: '';
            position: absolute;
            top: 1rem;
            bottom: 1rem;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(147, 197, 253, 0), rgba(147, 197, 253, 0.65), rgba(147, 197, 253, 0));
            opacity: 0.5;
        }

        .debug-resizer:hover::before,
        .debug-resizer:active::before {
            opacity: 1;
        }

        .debug-output-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
            min-height: 1.8rem;
        }

        .debug-copy-button {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.86);
            cursor: pointer;
            font: inherit;
            font-size: 0.72rem;
            font-weight: 700;
            line-height: 1;
            padding: 0.42rem 0.66rem;
        }

        .debug-copy-button:hover {
            background: rgba(255, 255, 255, 0.13);
        }

        .debug-copy-button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        .debug-output {
            margin: 0;
            min-height: 0;
            padding: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.85);
            color: rgba(226, 232, 240, 0.92);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 1100px) {
            :root {
                --debug-rail-width: 0px;
                --debug-rail-gap: 0px;
                --debug-rail-space: 0px;
            }


            .debug-rail {
                display: none;
            }

            .debug-resizer {
                display: none;
            }

            .canvas-shell {
                grid-column: 1 / -1;
            }

            .global-prompt {
                left: 50%;
            }
        }

    </style>
</head>
<body>
    <div class="canvas-shell" id="canvas-shell">
        <main id="app"></main>
    </div>
    <aside class="debug-rail" id="debug-rail">
        <div class="debug-output-header">
            <button class="debug-copy-button" id="debug-copy" type="button">Copy</button>
        </div>
        <pre class="debug-output" id="debug-output"></pre>
    </aside>
    <div class="debug-resizer" id="debug-resizer" role="separator" aria-orientation="vertical" aria-label="Resize debug panel"></div>
    <div class="new-canvas-backdrop" id="new-canvas-backdrop" hidden>
        <form class="new-canvas-modal" id="new-canvas-modal" role="dialog" aria-modal="true" aria-labelledby="new-canvas-title">
            <h2 id="new-canvas-title">New Canvas</h2>
            <input id="new-canvas-name" name="name" type="text" autocomplete="off" placeholder="Name">
            <div class="new-canvas-actions">
                <button type="button" id="new-canvas-cancel">Cancel</button>
                <button type="submit" id="new-canvas-create">Create</button>
            </div>
        </form>
    </div>
    <!-- Workspace-fix overlay. Shown when the runtime found a workspace-
         level error and an agent is trying to fix it (or finished and
         couldn't). Blocks input so a user-triggered job can't race the
         agent on the same workspace's git state. -->
    <div class="workspace-migration-overlay" id="workspace-migration-overlay" hidden>
        <div class="workspace-migration-card" role="status" aria-live="polite">
            <div class="workspace-migration-title" id="workspace-migration-title">Fixing workspace</div>
            <div class="workspace-migration-detail" id="workspace-migration-detail"></div>
            <div class="workspace-migration-error" id="workspace-migration-error" hidden></div>
            <div class="workspace-migration-actions" id="workspace-migration-actions" hidden>
                <button type="button" id="workspace-migration-cancel" hidden>Cancel</button>
                <button type="button" id="workspace-migration-retry" hidden>Try again</button>
            </div>
        </div>
    </div>
    <div class="global-prompt" id="global-prompt-bar">
        <div class="canvas-nav" aria-label="Canvas selection">
            <select id="canvas-select" aria-label="Canvas"></select>
            <button type="button" id="new-canvas">New</button>
        </div>
        <liquidos-callback class="prompt-send" id="global-submit-callback" on="submit" scope="" prompt-from="prompt">
            <form id="global-prompt">
                <select id="agent-select" class="agent-select" aria-label="Agent"></select>
                <textarea id="global-text" name="prompt"></textarea>
                <button type="submit">Send</button>
            </form>
        </liquidos-callback>
    </div>

    <script>
        const app = document.getElementById('app');
        const canvasShell = document.getElementById('canvas-shell');
        const globalForm = document.getElementById('global-prompt');
        const workspaceMigrationOverlay = document.getElementById('workspace-migration-overlay');
        const workspaceMigrationTitle = document.getElementById('workspace-migration-title');
        const workspaceMigrationDetail = document.getElementById('workspace-migration-detail');
        const workspaceMigrationError = document.getElementById('workspace-migration-error');
        const workspaceMigrationActions = document.getElementById('workspace-migration-actions');
        const workspaceMigrationRetry = document.getElementById('workspace-migration-retry');
        const workspaceMigrationCancel = document.getElementById('workspace-migration-cancel');
        workspaceMigrationCancel.classList.add('is-secondary');

        workspaceMigrationRetry.addEventListener('click', async () => {
            workspaceMigrationRetry.disabled = true;
            workspaceMigrationRetry.textContent = 'Retrying…';
            try {
                await fetch('/workspace/retry-migration', { method: 'POST' });
            } catch {
                // The next SSE-triggered /input refresh will surface whatever

            const surface = document.createElement('div');
            surface.className = 'surface';

            const back = document.createElement('div');
            back.className = 'component-face component-back';
            back.innerHTML = [
                '<div class="component-back-header">',
                '<div><h2>Requirements</h2></div>',
                '</div>',
                '<textarea data-feature-requirements spellcheck="true" placeholder="Describe what this component should do, what it may use, and any limits it should respect."></textarea>',
                '<div class="component-back-actions">',
                '<button type="button" data-feature-cancel>Cancel</button>',
                '<button type="button" class="component-save-button" data-feature-save disabled>Build</button>',
                '</div>',
                '<div class="component-requirements-status" data-feature-status aria-live="polite"></div>'
            ].join('');

            const flipButton = document.createElement('button');
            flipButton.type = 'button';
            flipButton.className = 'component-flip-button';
            flipButton.dataset.componentFlip = 'true';
            flipButton.textContent = 'Requirements';

            const status = document.createElement('div');
            status.className = 'status';
            status.hidden = true;

            front.append(surface);
            frame.append(flipButton, front, back);
            item.append(frame, status);
            flipButton.addEventListener('click', () => {
                showComponentSide(item, item.dataset.side === 'back' ? 'front' : 'back');
            });

            back.querySelector('[data-feature-requirements]').addEventListener('input', event => {
                back.querySelector('[data-feature-save]').disabled = event.currentTarget.value === (event.currentTarget.dataset.savedValue || '');
            });

            back.querySelector('[data-feature-cancel]').addEventListener('click', () => {
                const textarea = back.querySelector('[data-feature-requirements]');
                textarea.value = textarea.dataset.savedValue || '';
                back.querySelector('[data-feature-save]').disabled = true;
                back.querySelector('[data-feature-status]').textContent = '';
                showComponentSide(item, 'front');
            });

            back.querySelector('[data-feature-save]').addEventListener('click', () => {
                saveComponentFeatures(item)
                    .then(() => showComponentSide(item, 'front'))
                    .catch(error => {
                        back.querySelector('[data-feature-status]').textContent = 'Could not save: ' + error.message;
                    });
            });

            surface.addEventListener('liquidos:callback', event => {
                const detail = event.detail && typeof event.detail === 'object'
                    ? event.detail
                    : {};
                const prompt = String(detail.prompt || '').trim();
                const scope = String(detail.scope || '').trim();
                if (!prompt || !scope) {
                    return;
                }

                event.preventDefault();
                status.hidden = true;
                status.className = 'status';
                status.textContent = '';
                markScopeBusy(scope);

                submitPrompt(scope, prompt)
                    .then(() => {
                        status.hidden = true;
                        status.textContent = '';
                    })
                    .catch(error => {
                        clearScopeBusy(scope);
                        status.className = 'status error';
                        status.textContent = 'Error: ' + error.message;
                    });
            });

            return item;
        };

        const componentResourcesSig = (component) =>
            component && component.resources ? JSON.stringify(component.resources) : '';

        // --- Minimal DOM morph ---------------------------------------------
        // Replacing component HTML with `surface.innerHTML = newHtml` destroys
        // element identity on every server-side update: CSS entry animations
        // re-fire, input selection / focus is lost, <video> and <canvas>
        // restart. morphChildren walks the existing tree and patches it
        // in-place against the new HTML — nodes that didn't structurally
        // change keep their identity.
        const morphAttributes = (target, source) => {
            for (let i = 0; i < source.attributes.length; i++) {
                const attr = source.attributes[i];
                if (target.getAttribute(attr.name) !== attr.value) {
                    target.setAttribute(attr.name, attr.value);
                }
            }
            const sourceNames = new Set();
            for (let i = 0; i < source.attributes.length; i++) sourceNames.add(source.attributes[i].name);
            for (let i = target.attributes.length - 1; i >= 0; i--) {
                const name = target.attributes[i].name;
                if (!sourceNames.has(name)) target.removeAttribute(name);
            }
        };

        const morphNode = (target, source) => {
            if (target.nodeType !== source.nodeType) {
                target.replaceWith(source);
                return source;
            }
            if (target.nodeType === Node.TEXT_NODE || target.nodeType === Node.COMMENT_NODE) {
                if (target.nodeValue !== source.nodeValue) target.nodeValue = source.nodeValue;
                return target;
            }
            if (target.nodeType === Node.ELEMENT_NODE) {
                if (target.tagName !== source.tagName) {
                    target.replaceWith(source);
                    return source;
                }
                morphAttributes(target, source);
                // Form-control value isn't reflected in attributes once the
                // user has edited the field; sync it explicitly so server
                // re-renders that include the latest value still take effect,
                // but user typing isn't blown away mid-edit.
                if (target.tagName === 'INPUT' && source.hasAttribute('value')) {
                    const v = source.getAttribute('value');
                    if (document.activeElement !== target && target.value !== v) target.value = v;
                }
                if (target.tagName === 'TEXTAREA' && document.activeElement !== target) {
                    if (target.value !== source.textContent) target.value = source.textContent;
                }
                morphChildren(target, source);
                return target;
            }
            return target;
        };

        const morphChildren = (targetParent, sourceParent) => {
            const targetChildren = Array.from(targetParent.childNodes);
            const sourceChildren = Array.from(sourceParent.childNodes);
            const max = Math.max(targetChildren.length, sourceChildren.length);
            for (let i = 0; i < max; i++) {
                const t = targetChildren[i];
                const s = sourceChildren[i];
                if (t && s) morphNode(t, s);
                else if (s) targetParent.appendChild(s);
                else if (t) t.remove();
            }
        };

        const morphInto = (target, html) => {
            const tpl = document.createElement('template');
            tpl.innerHTML = html || '';
            morphChildren(target, tpl.content);
        };

        const updateComponentItem = (item, component) => {
            const prev = item.__component;
            item.__component = component;
            item.dataset.componentPath = component.scope || '';
            item.dataset.repairLevel = component.repairLevel || '';
            item.classList.toggle('canvas-repair-item', component.repairLevel === 'canvas');
            const surface = item.querySelector('.surface');
            if (!surface) return;

            // Only touch the inner DOM when html or resources actually
            // changed. State or layout updates ripple through renderedInput
            // but shouldn't destroy the component's mount-time state (audio
            // context, timers, etc.).
            const htmlChanged = !prev || prev.html !== component.html;
            const resourcesChanged = componentResourcesSig(prev) !== componentResourcesSig(component);
            if (htmlChanged) {
                morphInto(surface, component.html || '');
            }
            if (htmlChanged || resourcesChanged) {
                mountComponentFunctions(item, component);
            }
        };


        const orderedIndexes = () =>
            latestComponents.map(component => component.index);
        const renderCanvas = (items, layout) => {
            const commit = () => {
                const nextItems = [];

                items.forEach(item => {
                    const index = Number(item.dataset.componentIndex);
                    const existing = renderedItemsByIndex.get(index);
                    const component = latestComponentByIndex.get(index);

                    if (existing && component) {
                        updateComponentItem(existing, component);
                        nextItems.push(existing);
                        return;
                    }

                    nextItems.push(item);
                    renderedItemsByIndex.set(index, item);
                    if (component) {
                        updateComponentItem(item, component);
                    }
                });

                Array.from(renderedItemsByIndex.entries()).forEach(([index, item]) => {
                    if (!nextItems.includes(item)) {
                        destroyComponentFunctions(item);
                        renderedItemsByIndex.delete(index);
                    }
                });

                // Hand the presentation clean items. Whatever inline styles a
                // previous presentation set (transforms, absolute positions,
                // animations) get cleared, so the new place() call starts from
                // a known state without needing each presentation to do its
                // own defensive resets.
                nextItems.forEach(item => {
                    item.style.position = '';
                    item.style.left = '';
                    item.style.top = '';
                    item.style.width = '';
                    item.style.transformOrigin = '';
                    item.style.transform = '';
                    item.style.animation = '';
                    item.style.zIndex = '';
                });
                if (currentCanvas) {
                    try {
                        currentCanvas.place(nextItems, latestComponents, latestCanvasState);
                    } catch (error) {
                        // A broken place() shouldn't freeze the canvas. Drop
                        // canvas.js back to "none" — the fallback below will
                        // at least render the cards directly, and the next
                        // render attempt re-runs loadCanvas.
                        try { currentCanvas.teardown(); } catch {}
                        currentCanvas = null;
                        currentCanvasCacheKey = null;
                        app.replaceChildren(...nextItems);
                        console.error('canvas.js place threw:', error);
                    }
                } else {
                    // canvas.js not loaded yet; the next render after
                    // loadCanvas resolves will pick this up.
                    app.replaceChildren(...nextItems);
                }
                restoreOpenRequirementsOverlay();
                requestAnimationFrame(() => {
                    nextItems.forEach(item => delete item.dataset.layoutEnter);
                });
                restoreScrollPosition();
                syncCallbackState();
            };

            // No document.startViewTransition wrapper here: a global crossfade
            // captures a flat snapshot of the canvas (including any 3D-
            // transformed content) and stacks it over the live render for one
            // frame, which reads as a scale/opacity pop in presentations that
            // animate their own transforms. Presentations should own their
            // transitions; the harness keeps the DOM stable.
            commit();
        };

        const showCanvasDamaged = error => {
            app.replaceChildren(Object.assign(document.createElement('div'), {
                className: 'canvas-damaged-shell'
            }));
            app.firstElementChild.innerHTML = [
                '<div class="canvas-damaged-dialog" role="dialog" aria-modal="true" aria-labelledby="canvas-damaged-title">',
                '<h1 id="canvas-damaged-title">Canvas is damaged</h1>',
                '<button type="button">Repair</button>',
                '</div>'
            ].join('');
            app.firstElementChild.querySelector('button').addEventListener('click', event => {
                event.currentTarget.disabled = true;
                submitCanvasPrompt('Repair required due to error: ' + (error && error.message ? error.message : 'unknown')).catch(repairError => {
                    event.currentTarget.disabled = false;
                });
            });
        };

        const applyComponentUpdates = components => {
            if (!Array.isArray(components) || components.length === 0) {
                return false;
            }

            return components.every(updated => {
                const scope = updated.scope || '';
                const item = Array.from(renderedItemsByIndex.values())
                    .find(entry => entry.dataset.componentPath === scope);

                if (!item) {
                    return false;
                }

                const index = Number(item.dataset.componentIndex);
                const merged = { ...updated, index };
                const position = latestComponents.findIndex(component => component.index === index);

                latestComponentByIndex.set(index, merged);
                if (position !== -1) {
                    latestComponents[position] = merged;
                }

                updateComponentItem(item, merged);
                return true;
            });
        };

        const load = async () => {
            const data = await fetch('/input', { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error('/input returned ' + response.status);
                }

                return response.json();
            });

            if (!Array.isArray(data.components)) {
                throw new Error('/input did not return { components: [...] }');
            }

            const snapshot = JSON.stringify(data);

            if (snapshot === lastCanvasSnapshot) {
                return;
            }

            currentCanvasPath = typeof data.canvasPath === 'string' && data.canvasPath ? data.canvasPath : currentCanvasPath;
            latestCanvasState = data.state || { canvas: null, components: {} };
            updateWorkspaceMigrationOverlay(data.workspace);
            globalSubmitCallback.setAttribute('scope', currentCanvasPath);
            latestComponents = data.components.map((component, index) => ({
                ...component,
                index,
                repairLevel: component.repairLevel || (data.canvasError && component.scope === data.canvasPath ? 'canvas' : '')
            }));
            latestComponentByIndex = new Map(latestComponents.map(component => [component.index, component]));
            try {
                await loadCanvas(data.canvasJsVersion, { canvasPath: currentCanvasPath });
            } catch (error) {
                if (currentCanvas) {
                    try { currentCanvas.teardown(); } catch {}
                    currentCanvas = null;
                    currentCanvasCacheKey = null;
                }
                latestComponents = [{
                    index: 0,
                    scope: currentCanvasPath || '.',
                    repairLevel: 'canvas',
                    html: repairCardHtml({
                        level: 'canvas',
                        title: 'Canvas is damaged',
                        scope: currentCanvasPath || '.',
                        message: error.message
                    })
                }];
                latestComponentByIndex = new Map([[0, latestComponents[0]]]);
            }
            const items = latestComponents.map(renderComponent);
            instanceStyle.textContent = '';
            renderCanvas(items, null);
            lastCanvasSnapshot = snapshot;
        };

        const loadCanvases = async () => {
            const response = await fetch('/canvases', { cache: 'no-store' });

            if (!response.ok) {
                throw new Error('/canvases returned ' + response.status);
            }

            const data = await response.json();
            const canvases = Array.isArray(data.canvases) ? data.canvases : [];
            const current = typeof data.current === 'string' ? data.current : '';
            currentCanvasPath = typeof data.currentPath === 'string' && data.currentPath
                ? data.currentPath
                : (canvases.find(canvas => canvas.current)?.path || currentCanvasPath || '');
            currentCanvasName = current;

            canvasSelect.replaceChildren(...canvases.map(canvas => {
                const option = document.createElement('option');
                option.value = canvas.name || '';
                option.textContent = canvas.name || '';
                option.selected = option.value === current;
                return option;
            }));

            if (current && canvasSelect.value !== current) {
                canvasSelect.value = current;
            }

            if (!currentCanvasName) {
                currentCanvasName = canvasSelect.value || '';
            }
        };

        const loadAgentChoices = async () => {
            const response = await fetch('/agents/probe', { cache: 'no-store' });

            if (!response.ok) {
                throw new Error('/agents/probe returned ' + response.status);
            }

            const data = await response.json();
            const choices = Array.isArray(data.agentChoices) && data.agentChoices.length
                ? data.agentChoices
                : [
                    { id: 'hermes', label: 'Hermes', installed: true },
                    { id: 'pi', label: 'Pi', installed: false },
                    { id: 'codex', label: 'Codex', installed: false },
                    { id: 'claude-code', label: 'Claude Code', installed: false }
                ];
            const active = typeof data.agentKind === 'string' && data.agentKind.trim()
                ? data.agentKind.trim()
                : 'hermes';

            agentSelect.replaceChildren(...choices.map(choice => {
                const option = document.createElement('option');
                option.value = choice.id || '';
                option.textContent = choice.label || choice.id || '';
                option.selected = option.value === active;
                option.disabled = choice.installed === false;
                return option;
            }));

            if (active && agentSelect.value !== active) {
                agentSelect.value = active;
            }

            return data;
        };

        const switchAgentKind = async kind => {
            const response = await fetch('/agent/select', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ kind })
            });

            if (!response.ok) {
                throw new Error('/agent/select returned ' + response.status);
            }

            const result = await response.json();

            await loadAgentChoices();
            await loadDebugPanel().catch(() => {});

            return result;
        };

        const switchCanvas = async name => {
            const response = await fetch('/canvas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name })
            });

            if (!response.ok) {
                throw new Error('/canvas returned ' + response.status);
            }

            await loadCanvases();
            await load();
        };

        const createCanvas = async name => {
            const response = await fetch('/canvases', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name })
            });

            if (!response.ok) {
                throw new Error('/canvases returned ' + response.status);
            }

            await loadCanvases();
            await load();
        };

        globalText.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                globalForm.requestSubmit();
            }
        });


        canvasSelect.addEventListener('change', () => {
            switchCanvas(canvasSelect.value)
                .then(() => {
                })
                .catch(error => {
                    loadCanvases().catch(() => {});
                    showCanvasDamaged(error);
                });
        });

        agentSelect.addEventListener('change', () => {
            switchAgentKind(agentSelect.value)
                .then(() => {
                })
                .catch(error => {
                    loadAgentChoices().catch(() => {});
                });
        });

        const showNewCanvasModal = () => {
            newCanvasName.value = '';
            newCanvasCreate.disabled = false;
            newCanvasBackdrop.hidden = false;
            requestAnimationFrame(() => newCanvasName.focus());
        };

        const hideNewCanvasModal = () => {
            newCanvasBackdrop.hidden = true;
            newCanvas.focus();
        };

        newCanvas.addEventListener('click', showNewCanvasModal);

        newCanvasCancel.addEventListener('click', hideNewCanvasModal);

        newCanvasBackdrop.addEventListener('click', event => {
            if (event.target === newCanvasBackdrop) {
                hideNewCanvasModal();
            }
        });

        newCanvasModal.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                event.preventDefault();
                hideNewCanvasModal();
            }
        });

        newCanvasModal.addEventListener('submit', event => {
            event.preventDefault();

            if (newCanvasCreate.disabled) {
                return;
            }

            if (!newCanvasName.value.trim()) {
                newCanvasName.focus();
                return;
            }

            newCanvasCreate.disabled = true;
            createCanvas(newCanvasName.value.trim())
                .then(() => {
                    hideNewCanvasModal();
                })
                .catch(error => {
                    newCanvasCreate.disabled = false;
                    newCanvasName.focus();
                });
        });

        globalSubmitCallback.addEventListener('liquidos:callback', event => {
            event.preventDefault();

            const prompt = String(event.detail?.prompt || '').trim();
            const scope = String(event.detail?.scope || '').trim();

            if (!prompt) {
                globalText.focus();
                return;
            }

            if (!scope) {
                return;
            }

            markScopeBusy(scope);
            submitPrompt(scope, prompt)
                .catch(() => {
                    clearScopeBusy(scope);
                });
        });

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(saveScrollPosition, 120);
        }, { passive: true });

        window.addEventListener('resize', updatePromptChromeSpace);

        if (window.ResizeObserver) {
            const chromeResizeObserver = new ResizeObserver(updatePromptChromeSpace);

            chromeResizeObserver.observe(globalPromptBar);
        }


        updatePromptChromeSpace();

        new EventSource('/events').onmessage = event => {
            let payload = null;

            try {
                payload = JSON.parse(event.data);
            } catch (error) {
                payload = null;
            }

            if (payload && payload.type === 'queue-status') {
                const state = payload.state || { busy: false, job: null, jobs: [] };
                activeLanes = new Set((state.jobs || []).map(job => job.lane).filter(Boolean));
                syncBusyUI();
                handleCompleted(payload.completed);
                // No load() here: queue updates are purely about busy UI.
                // File writes from completing jobs flow through their own
                // components-changed events via fs.watch.
                return;
            }

            if (payload && payload.type === 'agent-mode') {
                loadAgentChoices().catch(() => {});
                loadDebugPanel().catch(() => {});
                return;
            }

            if (payload && payload.type === 'canvases-changed') {
                loadCanvases().catch(() => {});
                return;
            }

            if (payload && payload.type === 'components-changed') {
                if (applyComponentUpdates(payload.components)) {
                    syncCallbackState();
                } else {
                    load().catch(showCanvasDamaged);
                }
                return;
            }

            if (payload && payload.type === 'state-changed') {
                latestCanvasState = payload.state || { canvas: null, components: {} };
                if (currentCanvas && renderedItemsByIndex.size > 0) {
                    const items = Array.from(renderedItemsByIndex.entries())
                        .sort(([a], [b]) => a - b)
                        .map(([, item]) => item);
                    try {
                        currentCanvas.place(items, latestComponents, latestCanvasState);
                    } catch (error) {
                        console.error('canvas.js place threw on state update:', error);
                        load().catch(showCanvasDamaged);
                    }
                }
                return;
            }

            load().catch(showCanvasDamaged);
        };

        loadDebugPanel()
            .then(startDebugStream)
            .catch(error => {
                if (debugOutput) {
                    debugOutput.textContent = 'Error: ' + error.message;
                }
            });

        loadCanvases()
            .then(load)
            .catch(showCanvasDamaged);
        loadAgentChoices().catch(error => {
            if (debugOutput) {
                debugOutput.textContent = 'Error: ' + error.message;
            }
        });

        // Focus the prompt bar on launch so the user can type immediately.
        globalText.focus();

    </script>
</body>
</html>
