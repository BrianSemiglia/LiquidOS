<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Edit</title>
    <style>
        body {
            margin: 0;
            padding: 2rem;
            background: #0f172a;
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #app {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }
    </style>
</head>
<body>
    <main id="app"></main>

    <script>
        const app = document.getElementById('app');

        const load = async () => {
            const data = await fetch('/component', { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error('/component returned ' + response.status);
                }

                return response.json();
            });

            if (!Array.isArray(data.components)) {
                throw new Error('/component did not return { components: [...] }');
            }

            app.innerHTML = data.components
                .map(component => component.html || '')
                .join('\n');
        };

        new EventSource('/events').onmessage = () => {
            load().catch(error => {
                app.textContent = 'Error: ' + error.message;
            });
        };

        load().catch(error => {
            app.textContent = 'Error: ' + error.message;
        });
    </script>
</body>
</html>
