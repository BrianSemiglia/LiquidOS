<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { font-family: system-ui, sans-serif; background: #0f172a; }
        #canvas { padding: 24px; }
        .error { color: #fecaca; background: #7f1d1d; padding: 16px; border-radius: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="canvas">Loading...</div>
    <script>
        const render = data => {
            const canvas = document.getElementById('canvas');
            canvas.replaceChildren();

            for (const component of data.components || []) {
                const template = document.createElement('template');
                template.innerHTML = component.html || '';

                for (const style of template.content.querySelectorAll('style')) {
                    document.head.appendChild(style.cloneNode(true));
                    style.remove();
                }

                canvas.appendChild(template.content.cloneNode(true));
            }
        };

        const showError = error => {
            document.getElementById('canvas').innerHTML = `<div class="error">Error: ${error.message}</div>`;
        };

        const load = () => fetch('/component', { cache: 'no-store' })
            .then(response => response.ok ? response.json() : response.text().then(text => Promise.reject(new Error(text || `HTTP ${response.status}`))))
            .then(render)
            .catch(showError);

        new EventSource('/events').onmessage = event => {
            if (event.data === 'reload') load();
        };

        load();
    </script>
</body>
</html>
