<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
    <div id="canvas">Loading...</div>
    <script>
        console.log('Fetching /component...');
        fetch('/component')
            .then(r => {
                console.log('Response status:', r.status);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(comp => {
                console.log('Component loaded:', comp);
                document.getElementById('canvas').innerHTML = comp.html;
            })
            .catch(err => {
                console.error('Error:', err);
                document.getElementById('canvas').innerHTML = '<div style="color:red;padding:2rem">Error: ' + err.message + '<br><br>Check console (Cmd+Opt+J)</div>';
            });

        const source = new EventSource('http://localhost:3000/events');
        source.onmessage = (event) => {
            if (event.data === 'reload') location.reload();
        };
    </script>
</body>
</html>
