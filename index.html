<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Edit</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 2rem 7rem;
            background: #111827;
            color: #f9fafb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #app {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .item {
            display: grid;
            gap: 0.75rem;
            min-width: 0;
            border-radius: 10px;
            outline: 2px solid transparent;
            outline-offset: 4px;
        }

        .item[data-selected="true"] {
            outline-color: #38bdf8;
        }

        .item[data-active="true"] {
            outline-color: #facc15;
        }

        .surface {
            min-width: 0;
        }

        .status {
            min-height: 1.25rem;
            color: #93c5fd;
            font-size: 0.85rem;
        }

        .error {
            color: #fecaca;
        }

        .global-prompt {
            position: fixed;
            left: 50%;
            bottom: 1rem;
            z-index: 20;
            display: grid;
            grid-template-columns: auto auto minmax(12rem, 1fr) auto;
            gap: 0.5rem;
            width: min(calc(100vw - 2rem), 54rem);
            padding: 0.75rem;
            border: 1px solid #334155;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.96);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
            transform: translateX(-50%);
        }

        .global-prompt textarea {
            min-width: 0;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #020617;
            color: #f9fafb;
            font: inherit;
        }

        .canvas-nav {
            display: flex;
            gap: 0.35rem;
            min-width: 0;
        }

        .canvas-nav select {
            min-width: 8rem;
            max-width: 12rem;
            height: 2.75rem;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #020617;
            color: #f9fafb;
            font: inherit;
            padding: 0 0.55rem;
        }

        .canvas-nav button {
            min-width: 3.4rem;
            background: #1e293b;
            color: #e0f2fe;
            border: 1px solid #475569;
        }

        .global-prompt textarea {
            height: 2.75rem;
            min-height: 2.75rem;
            max-height: 8rem;
            resize: vertical;
            padding: 0.65rem 0.75rem;
            line-height: 1.25;
        }

        .global-prompt button {
            height: 2.75rem;
            border: 0;
            border-radius: 6px;
            padding: 0 1rem;
            background: #38bdf8;
            color: #082f49;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
        }

        .global-prompt button:disabled {
            cursor: default;
            opacity: 0.55;
        }

        .delta-nav {
            display: flex;
            gap: 0.35rem;
        }

        .delta-nav button {
            min-width: 4.25rem;
            background: #1e293b;
            color: #e0f2fe;
            border: 1px solid #475569;
        }

        .global-status {
            position: fixed;
            left: 50%;
            bottom: 5.2rem;
            z-index: 21;
            width: min(calc(100vw - 2rem), 54rem);
            min-height: 1rem;
            color: #bae6fd;
            font-size: 0.8rem;
            transform: translateX(-50%);
        }

    </style>
</head>
<body>
    <main id="app"></main>
    <div class="global-status" id="global-status"></div>
    <form class="global-prompt" id="global-prompt">
        <div class="canvas-nav" aria-label="Canvas selection">
            <select id="canvas-select" aria-label="Canvas"></select>
            <button type="button" id="new-canvas">New</button>
        </div>
        <div class="delta-nav" aria-label="Delta navigation">
            <button type="button" id="undo-delta">Undo</button>
            <button type="button" id="redo-delta">Redo</button>
        </div>
        <textarea id="global-text" placeholder="Prompt the canvas"></textarea>
        <button type="submit">Send</button>
    </form>

    <script>
        const app = document.getElementById('app');
        const globalForm = document.getElementById('global-prompt');
        const globalText = document.getElementById('global-text');
        const globalStatus = document.getElementById('global-status');
        const canvasSelect = document.getElementById('canvas-select');
        const newCanvas = document.getElementById('new-canvas');
        const undoDelta = document.getElementById('undo-delta');
        const redoDelta = document.getElementById('redo-delta');
        const instanceStyle = document.createElement('style');
        const layoutStyle = document.createElement('style');
        const transitionStyle = document.createElement('style');
        let latestComponents = [];
        let activeComponentIndex = 0;
        let selectionAnchorIndex = 0;
        let selectedComponentIndexes = new Set([0]);
        let statusTimer;
        let scrollSaveTimer;
        let currentLayout = null;
        let currentTransition = null;
        const renderedItemsByIndex = new Map();
        let latestComponentByIndex = new Map();

        instanceStyle.id = 'instance-style';
        document.head.append(instanceStyle);
        layoutStyle.id = 'layout-style';
        document.head.append(layoutStyle);
        transitionStyle.id = 'transition-style';
        document.head.append(transitionStyle);
        const scrollKey = canvasName => 'live-edit-scroll:' + (canvasName || 'default');

        const currentScrollKey = () => scrollKey(canvasSelect.value);

        const saveScrollPosition = () => {
            try {
                sessionStorage.setItem(currentScrollKey(), String(window.scrollY || 0));
            } catch (error) {
                // Ignore storage failures; scroll persistence is best-effort.
            }
        };

        const loadScrollPosition = () => {
            try {
                const raw = sessionStorage.getItem(currentScrollKey());
                const value = Number.parseInt(raw || '0', 10);
                return Number.isFinite(value) && value >= 0 ? value : 0;
            } catch (error) {
                return 0;
            }
        };

        const restoreScrollPosition = () => {
            const top = loadScrollPosition();
            requestAnimationFrame(() => {
                window.scrollTo({
                    top,
                    left: 0,
                    behavior: 'auto'
                });
            });
        };

        const setLayout = layout => {
            currentLayout = layout && typeof layout === 'object' ? layout : null;
            layoutStyle.textContent = currentLayout && typeof currentLayout.css === 'string'
                ? currentLayout.css
                : '';
            const style = currentLayout?.appStyle;

            if (style && typeof style === 'object') {
                Object.entries(style).forEach(([property, value]) => {
                    app.style.setProperty(property, String(value));
                });
            } else {
                app.removeAttribute('style');
            }

            if (currentLayout?.bodyStyle && typeof currentLayout.bodyStyle === 'object') {
                Object.entries(currentLayout.bodyStyle).forEach(([property, value]) => {
                    document.body.style.setProperty(property, String(value));
                });
            } else {
                document.body.style.overflow = '';
                document.body.style.padding = '';
            }
        };

        const setTransition = transition => {
            currentTransition = transition && typeof transition === 'object' ? transition : null;
            transitionStyle.textContent = currentTransition && typeof currentTransition.css === 'string'
                ? currentTransition.css
                : '';
        };

        const loadJsonResource = async resourcePath => {
            const response = await fetch(resourcePath, { cache: 'no-store' });

            if (!response.ok) {
                throw new Error(resourcePath + ' returned ' + response.status);
            }

            return response.json();
        };

        const submitPrompt = async (target, request) => {
            const response = await fetch('/output', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ target, request })
            });

            if (!response.ok) {
                throw new Error('/output returned ' + response.status);
            }

            setBusy({ busy: true, job: { prompt } });
            watchBusy();
        };

        const submitCanvasPrompt = async prompt => {
            const selectedComponents = latestComponents
                .filter(component => selectedComponentIndexes.has(component.index))
                .map(component => ({
                    index: component.index,
                    componentPath: component.componentPath || null,
                    file: component.file || null,
                    resources: component.resources || {},
                    data: component.data || null
                }));

            const response = await fetch('/output', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ scope: 'canvas', prompt, selectedComponents })
            });

            if (!response.ok) {
                throw new Error('/output returned ' + response.status);
            }

            setBusy({ busy: true, job: { prompt } });
            watchBusy();
        };

        const stepDelta = async direction => {
            const button = direction === 'undo' ? undoDelta : redoDelta;
            const response = await fetch('/deltas/' + direction, {
                method: 'POST'
            });

            if (!response.ok) {
                throw new Error('/deltas/' + direction + ' returned ' + response.status);
            }

            return response.json();
        };

        const runDeltaStep = direction => {
            const button = direction === 'undo' ? undoDelta : redoDelta;

            button.disabled = true;
            globalStatus.className = 'global-status';
            globalStatus.textContent = direction === 'undo' ? 'Undoing' : 'Redoing';

            stepDelta(direction)
                .then(() => {
                    globalStatus.textContent = direction === 'undo' ? 'Undone' : 'Redone';
                })
                .catch(error => {
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                })
                .finally(() => {
                    button.disabled = false;
                });
        };

        const renderCanvasOptions = data => {
            canvasSelect.replaceChildren(...data.canvases.map(canvas => {
                const option = document.createElement('option');

                option.value = canvas.name;
                option.textContent = canvas.name;
                return option;
            }));
            canvasSelect.value = data.current || '';
        };

        const loadCanvases = async () => {
            const data = await fetch('/canvases', { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error('/canvases returned ' + response.status);
                }

                return response.json();
            });

            renderCanvasOptions(data);
            return data;
        };

        const switchCanvas = async name => {
            saveScrollPosition();
            const data = await fetch('/canvas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name })
            }).then(response => {
                if (!response.ok) {
                    throw new Error('/canvas returned ' + response.status);
                }

                return response.json();
            });

            renderCanvasOptions(data);
            await load();
        };

        const createCanvas = async name => {
            saveScrollPosition();
            const data = await fetch('/canvases', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name })
            }).then(response => {
                if (!response.ok) {
                    throw new Error('/canvases returned ' + response.status);
                }

                return response.json();
            });

            renderCanvasOptions(data);
            await load();
        };

        const setBusy = state => {
            globalStatus.className = state.busy ? 'global-status' : 'global-status';
            globalStatus.textContent = state.job?.prompt ? 'Agent working: ' + state.job.prompt : (state.busy ? 'Agent working' : '');
            globalForm.querySelector('button[type="submit"]').disabled = Boolean(state.busy);
        };

        const refreshStatus = async () => {
            const state = await fetch('/status', { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error('/status returned ' + response.status);
                }

                return response.json();
            });

            setBusy(state);
            return state;
        };

        const watchBusy = () => {
            clearInterval(statusTimer);
            refreshStatus().catch(() => {});
            statusTimer = setInterval(() => {
                refreshStatus().then(state => {
                    if (!state.busy) {
                        clearInterval(statusTimer);
                    }
                }).catch(() => {});
            }, 900);
        };

        const renderComponent = component => {
            const item = document.createElement('section');
            item.className = 'item';
            item.dataset.componentIndex = component.index;
            item.dataset.componentPath = component.componentPath || '';
            item.__component = component;

            const surface = document.createElement('div');
            surface.className = 'surface';
            surface.innerHTML = component.html || '';

            const status = document.createElement('div');
            status.className = 'status';
            status.hidden = true;

            item.append(surface, status);

            item.addEventListener('pointerdown', () => {
                selectComponent(component.index);
            });

            surface.addEventListener('click', event => {
                const action = event.target.closest('[data-live-prompt]');

                if (!action || !surface.contains(action)) {
                    return;
                }

                const prompt = String(action.dataset.livePrompt || '').trim();

                if (!prompt) {
                    return;
                }

                event.preventDefault();
                selectComponent(component.index);
                action.disabled = true;
                status.hidden = false;
                status.className = 'status';
                status.textContent = 'Sending';
                setBusy({ busy: true, job: { prompt } });

                submitPrompt(item.__component || component, prompt)
                    .then(() => {
                        status.textContent = 'Sent';
                    })
                    .catch(error => {
                        setBusy({ busy: false, job: null });
                        action.disabled = false;
                        status.className = 'status error';
                        status.textContent = 'Error: ' + error.message;
                    });
            });

            return item;
        };

        const updateComponentItem = (item, component) => {
            item.__component = component;
            item.dataset.componentPath = component.componentPath || '';
            const surface = item.querySelector('.surface');
            if (surface) {
                surface.innerHTML = component.html || '';
                activateSurfaceScripts(surface);
            }
        };

        const syncActiveComponent = components => {
            if (!components.some(component => component.index === activeComponentIndex) && components.length) {
                activeComponentIndex = components[0].index;
            }

            if (!components.some(component => component.index === selectionAnchorIndex)) {
                selectionAnchorIndex = activeComponentIndex;
            }

            selectedComponentIndexes = new Set(
                [...selectedComponentIndexes].filter(index =>
                    components.some(component => component.index === index)
                )
            );

            if (!selectedComponentIndexes.size && components.length) {
                selectedComponentIndexes.add(activeComponentIndex);
            }
        };

        const applyLayout = (items, layout) => {
            setLayout(layout);

            if (!layout || typeof layout !== 'object') {
                return;
            }

            const itemStyles = Array.isArray(layout.items) ? layout.items : [];
            const byIndex = new Map(itemStyles.map(entry => [entry.index, entry]));
            const bodyStyle = layout.bodyStyle && typeof layout.bodyStyle === 'object' ? layout.bodyStyle : null;

            if (bodyStyle) {
                if (typeof bodyStyle.overflow === 'string') {
                    document.body.style.overflow = bodyStyle.overflow;
                }
                if (typeof bodyStyle.padding === 'string') {
                    document.body.style.padding = bodyStyle.padding;
                }
            }

            items.forEach(item => {
                const layout = byIndex.get(Number(item.dataset.componentIndex));

                if (!layout) {
                    item.style.position = '';
                    item.style.left = '';
                    item.style.top = '';
                    item.style.width = '';
                    item.style.transformOrigin = '';
                    item.style.transform = '';
                    item.style.animation = '';
                    item.style.zIndex = '';
                    return;
                }

                item.style.position = layout.position || 'absolute';
                item.style.left = layout.left || '';
                item.style.top = layout.top || '';
                item.style.width = layout.width || '';
                item.style.transformOrigin = layout.transformOrigin || 'center center';
                item.style.transform = layout.transform || '';
                item.style.animation = layout.animation || '';
                item.style.zIndex = layout.zIndex != null ? String(layout.zIndex) : '';
            });
        };

        const orderedIndexes = () =>
            latestComponents.map(component => component.index);

        const itemForIndex = index =>
            app.querySelector('[data-component-index="' + index + '"]');

        const applySelection = () => {
            app.querySelectorAll('.item').forEach(item => {
                const index = Number(item.dataset.componentIndex);

                item.dataset.selected = selectedComponentIndexes.has(index) ? 'true' : 'false';
                item.dataset.active = index === activeComponentIndex ? 'true' : 'false';
            });
        };

        const selectComponent = (index, extend = false) => {
            if (!latestComponents.some(component => component.index === index)) {
                return;
            }

            activeComponentIndex = index;

            if (!extend) {
                selectionAnchorIndex = index;
                selectedComponentIndexes = new Set([index]);
            } else {
                const indexes = orderedIndexes();
                const start = indexes.indexOf(selectionAnchorIndex);
                const end = indexes.indexOf(index);
                const low = Math.min(start, end);
                const high = Math.max(start, end);

                selectedComponentIndexes = new Set(indexes.slice(low, high + 1));
            }

            applySelection();
            itemForIndex(index)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        };

        const moveSelection = (direction, extend) => {
            const indexes = orderedIndexes();
            const position = indexes.indexOf(activeComponentIndex);

            if (position === -1) {
                return;
            }

            let nextIndex;

            if (direction === 'left') {
                nextIndex = indexes[Math.max(0, position - 1)];
            } else if (direction === 'right') {
                nextIndex = indexes[Math.min(indexes.length - 1, position + 1)];
            } else {
                nextIndex = verticalNeighbor(direction);
            }

            if (nextIndex !== undefined) {
                selectComponent(nextIndex, extend);
            }
        };

        const verticalNeighbor = direction => {
            const current = itemForIndex(activeComponentIndex);

            if (!current) {
                return activeComponentIndex;
            }

            const currentRect = current.getBoundingClientRect();
            const currentX = currentRect.left + currentRect.width / 2;
            const currentY = currentRect.top + currentRect.height / 2;
            const candidates = [...app.querySelectorAll('.item')]
                .map(item => {
                    const rect = item.getBoundingClientRect();
                    const index = Number(item.dataset.componentIndex);
                    const x = rect.left + rect.width / 2;
                    const y = rect.top + rect.height / 2;

                    return { index, x, y };
                })
                .filter(candidate =>
                    direction === 'up'
                        ? candidate.y < currentY - 8
                        : candidate.y > currentY + 8
                )
                .sort((a, b) =>
                    Math.abs(a.y - currentY) - Math.abs(b.y - currentY)
                    || Math.abs(a.x - currentX) - Math.abs(b.x - currentX)
                );

            return candidates[0]?.index ?? activeComponentIndex;
        };

        const activateSurfaceScripts = surface => {
            surface.querySelectorAll('script').forEach(script => {
                const next = document.createElement('script');

                Array.from(script.attributes).forEach(attribute => {
                    next.setAttribute(attribute.name, attribute.value);
                });

                next.textContent = script.textContent;
                script.replaceWith(next);
            });
        };

        const renderCanvas = (items, layout) => {
            const commit = () => {
                const nextItems = [];
                const nextIndexes = new Set();

                items.forEach(item => {
                    const index = Number(item.dataset.componentIndex);
                    const existing = renderedItemsByIndex.get(index);
                    const component = latestComponentByIndex.get(index);

                    nextIndexes.add(index);

                    if (existing && component) {
                        updateComponentItem(existing, component);
                        nextItems.push(existing);
                        return;
                    }

                    nextItems.push(item);
                    renderedItemsByIndex.set(index, item);
                    if (component) {
                        updateComponentItem(item, component);
                    } else {
                        activateSurfaceScripts(item.querySelector('.surface'));
                    }
                });

                [...renderedItemsByIndex.keys()].forEach(index => {
                    if (!nextIndexes.has(index)) {
                        renderedItemsByIndex.get(index)?.remove();
                        renderedItemsByIndex.delete(index);
                    }
                });

                app.replaceChildren(...nextItems);
                applyLayout(items, layout);
                applySelection();
                restoreScrollPosition();
            };

            if (typeof document.startViewTransition === 'function') {
                document.startViewTransition(() => {
                    commit();
                });
            } else {
                commit();
            }
        };

        const load = async () => {
            const data = await fetch('/input', { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error('/input returned ' + response.status);
                }

                return response.json();
            });

            if (!Array.isArray(data.components)) {
                throw new Error('/input did not return { components: [...] }');
            }

            latestComponents = data.components;
            latestComponentByIndex = new Map(latestComponents.map(component => [component.index, component]));
            const layout = typeof data.layoutPath === 'string' && data.layoutPath.trim()
                ? await loadJsonResource(data.layoutPath)
                : typeof data.layout === 'object' && data.layout
                    ? data.layout
                    : null;
            const transition = typeof data.transitionPath === 'string' && data.transitionPath.trim()
                ? await loadJsonResource(data.transitionPath)
                : typeof data.transition === 'object' && data.transition
                    ? data.transition
                    : null;
            syncActiveComponent(latestComponents);

            const items = latestComponents.map(renderComponent);
            instanceStyle.textContent = typeof data.css === 'string' ? data.css : '';
            setTransition(transition);
            renderCanvas(items, layout);
        };

        globalText.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                globalForm.requestSubmit();
            }
        });

        undoDelta.addEventListener('click', () => {
            runDeltaStep('undo');
        });

        redoDelta.addEventListener('click', () => {
            runDeltaStep('redo');
        });

        canvasSelect.addEventListener('change', () => {
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Switching canvas';
            switchCanvas(canvasSelect.value)
                .then(() => {
                    globalStatus.textContent = 'Canvas switched';
                })
                .catch(error => {
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                    loadCanvases().catch(() => {});
                });
        });

        newCanvas.addEventListener('click', () => {
            const name = window.prompt('Canvas name');

            if (!name) {
                return;
            }

            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Creating canvas';
            createCanvas(name)
                .then(() => {
                    globalStatus.textContent = 'Canvas created';
                })
                .catch(error => {
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                });
        });

        globalForm.addEventListener('submit', event => {
            event.preventDefault();

            const prompt = globalText.value.trim();
            const button = globalForm.querySelector('button');

            if (!prompt) {
                globalText.focus();
                return;
            }

            button.disabled = true;
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Sending';
            setBusy({ busy: true, job: { prompt } });

            submitCanvasPrompt(prompt)
                .then(() => {
                    globalText.value = '';
                    globalStatus.textContent = 'Sent';
                })
                .catch(error => {
                    setBusy({ busy: false, job: null });
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                });
        });

        document.addEventListener('keydown', event => {
            const editable = event.target.closest('textarea,input,select,[contenteditable="true"]');
            const direction = {
                ArrowLeft: 'left',
                ArrowRight: 'right',
                ArrowUp: 'up',
                ArrowDown: 'down'
            }[event.key];

            if (!direction || editable) {
                return;
            }

            event.preventDefault();
            moveSelection(direction, event.shiftKey);
        });

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(saveScrollPosition, 120);
        }, { passive: true });

        new EventSource('/events').onmessage = () => {
            refreshStatus().catch(() => {});
            load().catch(error => {
                app.textContent = 'Error: ' + error.message;
            });
        };

        load().catch(error => {
            app.textContent = 'Error: ' + error.message;
        });
        loadCanvases().catch(error => {
            globalStatus.className = 'global-status error';
            globalStatus.textContent = 'Error: ' + error.message;
        });
        watchBusy();
    </script>
</body>
</html>
