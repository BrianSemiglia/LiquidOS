<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Live Edit</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --prompt-chrome-space: 8rem;
            --debug-rail-width: 22rem;
            --debug-rail-gap: 1rem;
        }

        body {
            margin: 0;
            padding: 2rem 2rem var(--prompt-chrome-space);
            padding-left: calc(var(--debug-rail-width) + var(--debug-rail-gap) + 1rem);
            background: #111827;
            color: #f9fafb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #app {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .item {
            display: grid;
            gap: 0.75rem;
            min-width: 0;
            border-radius: 10px;
            outline: 2px solid transparent;
            outline-offset: 4px;
        }

        .surface {
            min-width: 0;
        }

        .status {
            min-height: 1.25rem;
            color: #93c5fd;
            font-size: 0.85rem;
        }

        .error {
            color: #fecaca;
        }

        .global-prompt {
            position: fixed;
            left: calc(50% + (var(--debug-rail-width) + var(--debug-rail-gap)) / 2);
            bottom: 1rem;
            z-index: 20;
            display: grid;
            grid-template-columns: auto auto minmax(14rem, 1fr) auto auto;
            gap: 0.45rem;
            align-items: center;
            width: min(calc(100vw - var(--debug-rail-width) - var(--debug-rail-gap) - 2rem), 58rem);
            padding: 0.55rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 22px;
            background: rgba(34, 34, 35, 0.72);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.44),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(32px) saturate(1.35);
            -webkit-backdrop-filter: blur(32px) saturate(1.35);
            transform: translateX(-50%);
            -webkit-font-smoothing: antialiased;
        }

        .canvas-nav {
            display: flex;
            gap: 0.35rem;
            min-width: 0;
        }

        .canvas-nav select,
        .global-prompt textarea {
            min-width: 0;
            height: 2.45rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.92);
            font: inherit;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.18);
        }

        .canvas-nav select {
            min-width: 8rem;
            max-width: 12rem;
            padding: 0 0.65rem;
        }

        .canvas-nav .agent-select {
            min-width: 7rem;
            max-width: 9rem;
        }

        .global-prompt textarea {
            min-height: 2.45rem;
            max-height: 8rem;
            resize: vertical;
            padding: 0.6rem 0.75rem;
            line-height: 1.2;
        }

        .canvas-nav select:focus,
        .global-prompt textarea:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.11);
        }

        .global-prompt textarea::placeholder {
            color: rgba(255, 255, 255, 0.38);
        }

        .global-prompt button {
            height: 2.45rem;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 15px;
            padding: 0 0.85rem;
            background: rgba(255, 255, 255, 0.10);
            color: rgba(255, 255, 255, 0.82);
            cursor: default;
            font: inherit;
            font-weight: 650;
            letter-spacing: -0.01em;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .global-prompt button[type="submit"] {
            background: rgba(255, 255, 255, 0.70);
            color: rgba(20, 20, 21, 0.92);
            border-color: rgba(255, 255, 255, 0.24);
        }

        .global-prompt button:hover:not(:disabled),
        .canvas-nav select:hover,
        .global-prompt textarea:hover {
            background-color: rgba(255, 255, 255, 0.14);
        }

        .global-prompt button[type="submit"]:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.78);
        }

        .global-prompt button:active:not(:disabled) {
            transform: translateY(1px);
        }

        .global-prompt button:disabled {
            cursor: default;
            opacity: 0.45;
        }


        .global-status {
            position: fixed;
            left: calc(50% + (var(--debug-rail-width) + var(--debug-rail-gap)) / 2);
            bottom: 5.2rem;
            z-index: 21;
            width: min(calc(100vw - var(--debug-rail-width) - var(--debug-rail-gap) - 2rem), 58rem);
            min-height: 1rem;
            color: rgba(255, 255, 255, 0.62);
            font-size: 0.8rem;
            transform: translateX(-50%);
        }

        .debug-rail {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 25;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 1rem;
            width: var(--debug-rail-width);
            padding: 1rem;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 15, 30, 0.84);
            color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px) saturate(1.1);
            -webkit-backdrop-filter: blur(20px) saturate(1.1);
            overflow: hidden;
        }

        .debug-resizer {
            position: fixed;
            top: 0;
            bottom: 0;
            left: calc(var(--debug-rail-width) - 0.45rem);
            z-index: 26;
            width: 0.9rem;
            cursor: col-resize;
            touch-action: none;
            background: transparent;
        }

        .debug-resizer::before {
            content: '';
            position: absolute;
            top: 1rem;
            bottom: 1rem;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(147, 197, 253, 0), rgba(147, 197, 253, 0.65), rgba(147, 197, 253, 0));
            opacity: 0.5;
        }

        .debug-resizer:hover::before,
        .debug-resizer:active::before {
            opacity: 1;
        }

        .debug-rail h2,
        .debug-rail h3,
        .debug-rail p,
        .debug-rail dl {
            margin: 0;
        }

        .debug-rail h2 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .debug-summary {
            display: grid;
            gap: 0.5rem;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
        }

        .debug-summary dl {
            display: grid;
            gap: 0.35rem;
            margin: 0;
            padding: 0;
        }

        .debug-summary div {
            display: grid;
            gap: 0.15rem;
        }

        .debug-summary dt {
            color: rgba(255, 255, 255, 0.52);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .debug-summary dd {
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.85rem;
            margin: 0;
            word-break: break-word;
        }

        .debug-output {
            margin: 0;
            min-height: 0;
            padding: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.85);
            color: rgba(226, 232, 240, 0.92);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 0.72rem;
            line-height: 1.4;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 1100px) {
            :root {
                --debug-rail-width: 0px;
                --debug-rail-gap: 0px;
            }

            body {
                padding-left: 2rem;
            }

            .debug-rail {
                display: none;
            }

            .debug-resizer {
                display: none;
            }

            .global-prompt,
            .global-status {
                left: 50%;
            }
        }

    </style>
</head>
<body>
    <main id="app"></main>
    <aside class="debug-rail" id="debug-rail">
        <section class="debug-summary">
            <dl>
                <div>
                    <dt>Agent</dt>
                    <dd id="debug-current-agent">Loading</dd>
                </div>
                <div>
                    <dt>Provider</dt>
                    <dd id="debug-current-backend">Loading</dd>
                </div>
                <div>
                    <dt>Canvas</dt>
                    <dd id="debug-current-canvas">Loading</dd>
                </div>
            </dl>
        </section>
        <pre class="debug-output" id="debug-output"></pre>
    </aside>
    <div class="debug-resizer" id="debug-resizer" role="separator" aria-orientation="vertical" aria-label="Resize debug panel"></div>
    <div class="global-status" id="global-status"></div>
    <form class="global-prompt" id="global-prompt">
        <div class="canvas-nav" aria-label="Canvas selection">
            <select id="agent-select" class="agent-select" aria-label="Agent"></select>
            <select id="canvas-select" aria-label="Canvas"></select>
            <button type="button" id="new-canvas">New</button>
        </div>
        <textarea id="global-text" placeholder="Prompt the canvas"></textarea>
        <button type="submit">Send</button>
    </form>

    <script>
        const app = document.getElementById('app');
        const globalForm = document.getElementById('global-prompt');
        const globalText = document.getElementById('global-text');
        const globalStatus = document.getElementById('global-status');
        const agentSelect = document.getElementById('agent-select');
        const canvasSelect = document.getElementById('canvas-select');
        const newCanvas = document.getElementById('new-canvas');
        const debugCurrentAgent = document.getElementById('debug-current-agent');
        const debugCurrentBackend = document.getElementById('debug-current-backend');
        const debugCurrentCanvas = document.getElementById('debug-current-canvas');
        const debugOutput = document.getElementById('debug-output');
        const debugResizer = document.getElementById('debug-resizer');
        const instanceStyle = document.createElement('style');
        const layoutStyle = document.createElement('style');
        const transitionStyle = document.createElement('style');
        let latestComponents = [];
        let currentCanvasName = '';
        let currentCanvasPath = '';
        let statusTimer;
        let scrollSaveTimer;
        let currentLayout = null;
        let currentTransition = null;
        let debugResizePointerId = null;
        let debugResizeFrame = null;
        let debugLines = [];
        const livePromptInFlight = new Set();
        const renderedItemsByIndex = new Map();
        let latestComponentByIndex = new Map();
        let lastCanvasSnapshot = '';
        const agentKindKey = 'live-edit-agent-kind';

        instanceStyle.id = 'instance-style';
        document.head.append(instanceStyle);
        layoutStyle.id = 'layout-style';
        document.head.append(layoutStyle);
        transitionStyle.id = 'transition-style';
        document.head.append(transitionStyle);
        const scrollKey = canvasName => 'live-edit-scroll:' + (canvasName || 'default');
        const debugRailWidthKey = 'live-edit-debug-rail-width';

        const clampDebugRailWidth = value => Math.max(240, Math.min(Math.round(value), Math.max(240, Math.floor(window.innerWidth * 0.55))));

        const applyDebugRailWidth = width => {
            const nextWidth = clampDebugRailWidth(width);
            document.documentElement.style.setProperty('--debug-rail-width', nextWidth + 'px');

            try {
                localStorage.setItem(debugRailWidthKey, String(nextWidth));
            } catch (error) {
                // Ignore storage failures; the resize still applies for this session.
            }
        };

        const loadDebugRailWidth = () => {
            try {
                const stored = Number.parseInt(localStorage.getItem(debugRailWidthKey) || '', 10);
                return Number.isFinite(stored) && stored > 0 ? stored : 352;
            } catch (error) {
                return 352;
            }
        };

        const currentScrollKey = () => scrollKey(canvasSelect.value);

        const setBusy = state => {
            globalForm.dataset.busy = state?.busy ? 'true' : 'false';
            globalStatus.className = state?.busy ? 'global-status busy' : 'global-status';
            globalStatus.textContent = state?.busy ? 'Working' : '';
            globalForm.querySelector('button[type="submit"]').disabled = Boolean(state?.busy);
            updatePromptChromeSpace();
        };

        const renderDebugPanel = state => {
            if (!debugCurrentAgent || !debugCurrentBackend || !debugCurrentCanvas || !debugOutput) {
                return;
            }

            const current = state && typeof state.current === 'object' ? state.current : {};
            const active = state && typeof state.active === 'object' ? state.active : {};
            debugLines = Array.isArray(state?.lines) ? state.lines.slice(-200) : [];

            const sourceLabel = current.source === 'bundled'
                ? 'Bundled agent'
                : current.source === 'global'
                    ? 'Global agent'
                    : '';
            const backendParts = [];
            const backend = active.provider || active.model ? active : current;

            if (backend.provider) {
                backendParts.push(backend.provider);
            }
            if (backend.model) {
                backendParts.push(backend.model);
            }

            debugCurrentAgent.textContent = current.status
                ? current.status.charAt(0).toUpperCase() + current.status.slice(1)
                : 'Idle';
            if (current.status === 'running' || current.status === 'waiting') {
                if (current.label) {
                    debugCurrentAgent.textContent += ' · ' + current.label;
                } else if (sourceLabel) {
                    debugCurrentAgent.textContent += ' · ' + sourceLabel;
                }
            }
            debugCurrentBackend.textContent = backendParts.length ? backendParts.join(' · ') : 'Unavailable';
            debugCurrentCanvas.textContent = state && state.canvas ? state.canvas : 'Unknown';
            renderDebugLines();
        };


        const plainDebugText = line => String(line?.text || '');

        const renderDebugLines = () => {
            if (!debugOutput) {
                return;
            }

            debugOutput.textContent = debugLines.length
                ? debugLines.map(plainDebugText).join('\n')
                : '';
            debugOutput.scrollTop = debugOutput.scrollHeight;
        };

        let debugScrollPending = false;

        const scheduleDebugScroll = () => {
            if (debugScrollPending || !debugOutput) {
                return;
            }

            debugScrollPending = true;
            requestAnimationFrame(() => {
                debugScrollPending = false;
                debugOutput.scrollTop = debugOutput.scrollHeight;
            });
        };

        const appendDebugLine = line => {
            if (!line || !debugOutput) {
                return;
            }

            debugLines.push(line);
            debugOutput.append(document.createTextNode((debugOutput.textContent ? '\n' : '') + plainDebugText(line)));
            scheduleDebugScroll();
        };

        const startDebugStream = () => {
            const stream = new EventSource('/debug/agent/stream');

            stream.addEventListener('debug-line', event => {
                try {
                    appendDebugLine(JSON.parse(event.data).line);
                } catch (error) {
                    appendDebugLine({
                        at: new Date().toISOString(),
                        label: '[debug-stream]',
                        text: 'Malformed debug event: ' + error.message
                    });
                }
            });

            stream.onerror = () => {
                appendDebugLine({
                    at: new Date().toISOString(),
                    label: '[debug-stream]',
                    text: 'Disconnected; browser will retry.'
                });
            };
        };

        const loadDebugPanel = async () => {
            const response = await fetch('/debug/agent', { cache: 'no-store' });

            if (!response.ok) {
                throw new Error('/debug/agent returned ' + response.status);
            }

            renderDebugPanel(await response.json());
        };

        const saveScrollPosition = () => {
            try {
                sessionStorage.setItem(currentScrollKey(), String(window.scrollY || 0));
            } catch (error) {
                // Ignore storage failures; scroll persistence is best-effort.
            }
        };

        const loadScrollPosition = () => {
            try {
                const raw = sessionStorage.getItem(currentScrollKey());
                const value = Number.parseInt(raw || '0', 10);
                return Number.isFinite(value) && value >= 0 ? value : 0;
            } catch (error) {
                return 0;
            }
        };

        const restoreScrollPosition = () => {
            const top = loadScrollPosition();
            requestAnimationFrame(() => {
                window.scrollTo({
                    top,
                    left: 0,
                    behavior: 'auto'
                });
            });
        };

        const startDebugResize = event => {
            if (!debugResizer) {
                return;
            }

            debugResizePointerId = event.pointerId;
            debugResizer.setPointerCapture(event.pointerId);
            document.body.style.userSelect = 'none';
            document.body.style.cursor = 'col-resize';

            const move = moveEvent => {
                if (moveEvent.pointerId !== debugResizePointerId) {
                    return;
                }

                if (debugResizeFrame) {
                    cancelAnimationFrame(debugResizeFrame);
                }

                debugResizeFrame = requestAnimationFrame(() => {
                    applyDebugRailWidth(moveEvent.clientX);
                    updatePromptChromeSpace();
                });
            };

            const end = endEvent => {
                if (endEvent.pointerId !== debugResizePointerId) {
                    return;
                }

                if (debugResizeFrame) {
                    cancelAnimationFrame(debugResizeFrame);
                    debugResizeFrame = null;
                }

                try {
                    debugResizer.releasePointerCapture(debugResizePointerId);
                } catch (error) {
                    // Ignore release errors when the pointer is already gone.
                }

                debugResizePointerId = null;
                document.body.style.userSelect = '';
                document.body.style.cursor = '';
                window.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', end);
                window.removeEventListener('pointercancel', end);
            };

            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', end);
            window.addEventListener('pointercancel', end);
            event.preventDefault();
        };

        const updatePromptChromeSpace = () => {
            const promptTop = globalForm.getBoundingClientRect().top;
            const statusTop = globalStatus.textContent.trim()
                ? globalStatus.getBoundingClientRect().top
                : promptTop;

            document.documentElement.style.setProperty(
                '--prompt-chrome-space',
                Math.ceil(window.innerHeight - Math.min(promptTop, statusTop) + 16) + 'px'
            );
            document.body.style.paddingBottom = 'var(--prompt-chrome-space)';
        };

        const setLayout = layout => {
            currentLayout = layout && typeof layout === 'object' ? layout : null;
            layoutStyle.textContent = currentLayout && typeof currentLayout.css === 'string'
                ? currentLayout.css
                : '';
            const style = currentLayout?.appStyle;

            if (style && typeof style === 'object') {
                Object.entries(style).forEach(([property, value]) => {
                    app.style.setProperty(property, String(value));
                });
            } else {
                app.removeAttribute('style');
            }

            if (currentLayout?.bodyStyle && typeof currentLayout.bodyStyle === 'object') {
                Object.entries(currentLayout.bodyStyle).forEach(([property, value]) => {
                    document.body.style.setProperty(property, String(value));
                });
            } else {
                document.body.style.overflow = '';
                document.body.style.padding = '';
            }

            updatePromptChromeSpace();
        };

        applyDebugRailWidth(loadDebugRailWidth());
        if (debugResizer) {
            debugResizer.addEventListener('pointerdown', startDebugResize);
        }
        updatePromptChromeSpace();

        const setTransition = transition => {
            currentTransition = transition && typeof transition === 'object' ? transition : null;
            transitionStyle.textContent = currentTransition && typeof currentTransition.css === 'string'
                ? currentTransition.css
                : '';
        };

        const loadJsonResource = async resourcePath => {
            const response = await fetch(resourcePath, { cache: 'no-store' });

            if (!response.ok) {
                throw new Error(resourcePath + ' returned ' + response.status);
            }

            return response.json();
        };

        const submitPrompt = async (scope, request, parseError = '') => {
            if (parseError) {
                const repairPrompt = [
                    request,
                    '',
                    'Broken component:',
                    scope || '(unknown)',
                    'Parse error: ' + parseError
                ].filter(Boolean).join('\n');

                const response = await fetch('/output', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        scope: currentCanvasPath || '',
                        prompt: repairPrompt
                    })
                });

                if (!response.ok) {
                    throw new Error('/output returned ' + response.status);
                }

                setBusy({ busy: true });
                return;
            }

            const response = await fetch('/output', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ scope, prompt: request })
            });

            if (!response.ok) {
                throw new Error('/output returned ' + response.status);
            }

            setBusy({ busy: true });
        };

        const submitCanvasPrompt = async prompt => {
            const response = await fetch('/output', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    scope: currentCanvasPath || '',
                    prompt
                })
            });

            if (!response.ok) {
                throw new Error('/output returned ' + response.status);
            }

            setBusy({ busy: true });
        };

        const renderComponent = component => {
            const item = document.createElement('section');
            item.className = 'item';
            item.dataset.componentIndex = component.index;
            item.dataset.componentPath = component.componentPath || '';
            item.__component = component;

            const surface = document.createElement('div');
            surface.className = 'surface';
            surface.innerHTML = component.html || '';

            const status = document.createElement('div');
            status.className = 'status';
            status.hidden = true;

            item.append(surface, status);

            const handleLivePrompt = (event, action) => {
                if (!action || !surface.contains(action)) {
                    return;
                }

                if (!event.isTrusted || globalForm.dataset.busy === 'true') {
                    return;
                }

                const prompt = String(action.dataset.livePrompt || '').trim();

                if (!prompt) {
                    return;
                }

                const promptKey = (item.dataset.componentPath || component.componentPath || '') + '::' + prompt;

                if (livePromptInFlight.has(promptKey)) {
                    return;
                }

                event.preventDefault();
                action.disabled = true;
                status.hidden = true;
                status.className = 'status';
                status.textContent = '';
                setBusy({ busy: true });
                livePromptInFlight.add(promptKey);

                submitPrompt(item.__component?.componentPath || component.componentPath || '', prompt)
                    .then(() => {
                        status.hidden = true;
                        status.textContent = '';
                    })
                    .catch(error => {
                        setBusy({ busy: false, job: null });
                        action.disabled = false;
                        status.className = 'status error';
                        status.textContent = 'Error: ' + error.message;
                    })
                    .finally(() => {
                        livePromptInFlight.delete(promptKey);
                    });
            };

            surface.addEventListener('click', event => {
                handleLivePrompt(event, event.target.closest('[data-live-prompt]'));
            });

            surface.addEventListener('input', event => {
                handleLivePrompt(event, event.target.closest('[data-live-prompt]'));
            });

            surface.addEventListener('change', event => {
                handleLivePrompt(event, event.target.closest('[data-live-prompt]'));
            });

            return item;
        };

        const updateComponentItem = (item, component) => {
            item.__component = component;
            item.dataset.componentPath = component.componentPath || '';
            const surface = item.querySelector('.surface');
            if (surface) {
                surface.innerHTML = component.html || '';
                activateSurfaceScripts(surface);
            }
        };

        const applyLayout = (items, layout) => {
            setLayout(layout);

            if (!layout || typeof layout !== 'object') {
                return;
            }

            const itemStyles = Array.isArray(layout.items) ? layout.items : [];
            const byIndex = new Map(itemStyles.map(entry => [entry.index, entry]));
            const bodyStyle = layout.bodyStyle && typeof layout.bodyStyle === 'object' ? layout.bodyStyle : null;

            if (bodyStyle) {
                if (typeof bodyStyle.overflow === 'string') {
                    document.body.style.overflow = bodyStyle.overflow;
                }
                if (typeof bodyStyle.padding === 'string') {
                    document.body.style.padding = bodyStyle.padding;
                }
                updatePromptChromeSpace();
            }

            items.forEach(item => {
                const layout = byIndex.get(Number(item.dataset.componentIndex));

                if (!layout) {
                    item.style.position = '';
                    item.style.left = '';
                    item.style.top = '';
                    item.style.width = '';
                    item.style.transformOrigin = '';
                    item.style.transform = '';
                    item.style.animation = '';
                    item.style.zIndex = '';
                    return;
                }

                item.style.position = layout.position || 'absolute';
                item.style.left = layout.left || '';
                item.style.top = layout.top || '';
                item.style.width = layout.width || '';
                item.style.transformOrigin = layout.transformOrigin || 'center center';
                item.style.transform = layout.transform || '';
                item.style.animation = layout.animation || '';
                item.style.zIndex = layout.zIndex != null ? String(layout.zIndex) : '';
            });
        };

        const orderedIndexes = () =>
            latestComponents.map(component => component.index);

        const activateSurfaceScripts = surface => {
            surface.querySelectorAll('script').forEach(script => {
                const next = document.createElement('script');

                Array.from(script.attributes).forEach(attribute => {
                    next.setAttribute(attribute.name, attribute.value);
                });

                next.textContent = script.textContent;
                script.replaceWith(next);
            });
        };

        const renderCanvas = (items, layout) => {
            const commit = () => {
                const nextItems = [];

                items.forEach(item => {
                    const index = Number(item.dataset.componentIndex);
                    const existing = renderedItemsByIndex.get(index);
                    const component = latestComponentByIndex.get(index);

                    if (existing && component) {
                        updateComponentItem(existing, component);
                        nextItems.push(existing);
                        return;
                    }

                    nextItems.push(item);
                    renderedItemsByIndex.set(index, item);
                    if (component) {
                        updateComponentItem(item, component);
                    } else {
                        activateSurfaceScripts(item.querySelector('.surface'));
                    }
                });

                app.replaceChildren(...nextItems);
                applyLayout(items, layout);
                restoreScrollPosition();
            };

            if (typeof document.startViewTransition === 'function') {
                document.startViewTransition(() => {
                    commit();
                });
            } else {
                commit();
            }
        };

        const load = async () => {
            const data = await fetch('/input', { cache: 'no-store' }).then(response => {
                if (!response.ok) {
                    throw new Error('/input returned ' + response.status);
                }

                return response.json();
            });

            if (!Array.isArray(data.components)) {
                throw new Error('/input did not return { components: [...] }');
            }

            const snapshot = JSON.stringify(data);

            if (snapshot === lastCanvasSnapshot) {
                return;
            }

            latestComponents = data.components;
            latestComponentByIndex = new Map(latestComponents.map(component => [component.index, component]));
            const layout = typeof data.layoutPath === 'string' && data.layoutPath.trim()
                ? await loadJsonResource(data.layoutPath)
                : typeof data.layout === 'object' && data.layout
                    ? data.layout
                    : null;
            const transition = typeof data.transitionPath === 'string' && data.transitionPath.trim()
                ? await loadJsonResource(data.transitionPath)
                : typeof data.transition === 'object' && data.transition
                    ? data.transition
                    : null;

            const items = latestComponents.map(renderComponent);
            instanceStyle.textContent = typeof data.css === 'string' ? data.css : '';
            setTransition(transition);
            renderCanvas(items, layout);
            lastCanvasSnapshot = snapshot;
        };

        const loadCanvases = async () => {
            const response = await fetch('/canvases', { cache: 'no-store' });

            if (!response.ok) {
                throw new Error('/canvases returned ' + response.status);
            }

            const data = await response.json();
            const canvases = Array.isArray(data.canvases) ? data.canvases : [];
            const current = typeof data.current === 'string' ? data.current : '';
            currentCanvasPath = typeof data.currentPath === 'string' && data.currentPath
                ? data.currentPath
                : (canvases.find(canvas => canvas.current)?.path || currentCanvasPath || '');
            currentCanvasName = current;

            canvasSelect.replaceChildren(...canvases.map(canvas => {
                const option = document.createElement('option');
                option.value = canvas.name || '';
                option.textContent = canvas.name || '';
                option.selected = option.value === current;
                return option;
            }));

            if (current && canvasSelect.value !== current) {
                canvasSelect.value = current;
            }

            if (!currentCanvasName) {
                currentCanvasName = canvasSelect.value || '';
            }
        };

        const loadAgentChoices = async () => {
            const response = await fetch('/agents/probe', { cache: 'no-store' });

            if (!response.ok) {
                throw new Error('/agents/probe returned ' + response.status);
            }

            const data = await response.json();
            const choices = Array.isArray(data.agentChoices) && data.agentChoices.length
                ? data.agentChoices
                : [
                    { id: 'hermes', label: 'Hermes', installed: true },
                    { id: 'codex', label: 'Codex', installed: false },
                    { id: 'claude-code', label: 'Claude Code', installed: false }
                ];
            const selected = typeof data.agentKind === 'string' && data.agentKind.trim()
                ? data.agentKind.trim()
                : 'hermes';

            agentSelect.replaceChildren(...choices.map(choice => {
                const option = document.createElement('option');
                option.value = choice.id || '';
                option.textContent = choice.label || choice.id || '';
                option.selected = option.value === selected;
                option.disabled = choice.installed === false;
                return option;
            }));

            if (selected && agentSelect.value !== selected) {
                agentSelect.value = selected;
            }

            const storedAgentKind = (() => {
                try {
                    return localStorage.getItem(agentKindKey) || '';
                } catch (error) {
                    return '';
                }
            })().trim();

            if (storedAgentKind && storedAgentKind !== selected && choices.some(choice => choice.id === storedAgentKind && choice.installed !== false)) {
                await switchAgentKind(storedAgentKind);
            }

            return data;
        };

        const switchAgentKind = async kind => {
            const response = await fetch('/agent/select', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ kind })
            });

            if (!response.ok) {
                throw new Error('/agent/select returned ' + response.status);
            }

            const result = await response.json();

            try {
                localStorage.setItem(agentKindKey, String(kind || '').trim());
            } catch (error) {
                // Ignore persistence failures.
            }

            await loadAgentChoices();
            await loadDebugPanel().catch(() => {});

            return result;
        };

        const switchCanvas = async name => {
            const response = await fetch('/canvas', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name })
            });

            if (!response.ok) {
                throw new Error('/canvas returned ' + response.status);
            }

            await load();
            await loadCanvases();
        };

        globalText.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                globalForm.requestSubmit();
            }
        });


        canvasSelect.addEventListener('change', () => {
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Switching canvas';
            switchCanvas(canvasSelect.value)
                .then(() => {
                    globalStatus.textContent = 'Canvas switched';
                })
                .catch(error => {
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                    loadCanvases().catch(() => {});
                });
        });

        agentSelect.addEventListener('change', () => {
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Switching agent';
            switchAgentKind(agentSelect.value)
                .then(() => {
                    globalStatus.textContent = 'Agent switched';
                })
                .catch(error => {
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                    loadAgentChoices().catch(() => {});
                });
        });

        newCanvas.addEventListener('click', () => {
            const name = window.prompt('Canvas name');

            if (!name) {
                return;
            }

            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Creating canvas';
            createCanvas(name)
                .then(() => {
                    globalStatus.textContent = 'Canvas created';
                })
                .catch(error => {
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                });
        });

        globalForm.addEventListener('submit', event => {
            event.preventDefault();

            if (globalForm.dataset.busy === 'true') {
                return;
            }

            const prompt = globalText.value.trim();
            const button = globalForm.querySelector('button[type="submit"]');

            if (!prompt) {
                globalText.focus();
                return;
            }

            button.disabled = true;
            globalStatus.className = 'global-status';
            globalStatus.textContent = 'Sending';
            setBusy({ busy: true });

            submitCanvasPrompt(prompt)
                .then(() => {
                    globalText.value = '';
                })
                .catch(error => {
                    setBusy({ busy: false, job: null });
                    globalStatus.className = 'global-status error';
                    globalStatus.textContent = 'Error: ' + error.message;
                });
        });

        window.addEventListener('scroll', () => {
            clearTimeout(scrollSaveTimer);
            scrollSaveTimer = setTimeout(saveScrollPosition, 120);
        }, { passive: true });

        window.addEventListener('resize', updatePromptChromeSpace);

        if (window.ResizeObserver) {
            const chromeResizeObserver = new ResizeObserver(updatePromptChromeSpace);

            chromeResizeObserver.observe(globalForm);
            chromeResizeObserver.observe(globalStatus);
        }

        new MutationObserver(updatePromptChromeSpace).observe(globalStatus, {
            childList: true,
            characterData: true,
            subtree: true
        });

        updatePromptChromeSpace();

        new EventSource('/events').onmessage = event => {
            let payload = null;

            try {
                payload = JSON.parse(event.data);
            } catch (error) {
                payload = null;
            }

            if (payload && payload.type === 'queue-status') {
                setBusy(payload.state || { busy: false, job: null });
                load().catch(error => {
                    app.textContent = 'Error: ' + error.message;
                });
                return;
            }

            if (payload && payload.type === 'agent-mode') {
                loadAgentChoices().catch(() => {});
                loadDebugPanel().catch(() => {});
                return;
            }

            if (payload && payload.type === 'canvases-changed') {
                loadCanvases().catch(() => {});
                return;
            }

            load().catch(error => {
                app.textContent = 'Error: ' + error.message;
            });
        };

        loadDebugPanel()
            .then(startDebugStream)
            .catch(error => {
                if (debugOutput) {
                    debugOutput.textContent = 'Error: ' + error.message;
                }
            });

        load().catch(error => {
            app.textContent = 'Error: ' + error.message;
        });
        loadAgentChoices().catch(error => {
            globalStatus.className = 'global-status error';
            globalStatus.textContent = 'Error: ' + error.message;
        });
        loadCanvases().catch(error => {
            globalStatus.className = 'global-status error';
            globalStatus.textContent = 'Error: ' + error.message;
        });

    </script>
</body>
</html>
